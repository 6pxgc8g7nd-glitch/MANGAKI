# 每次推上 main 就把網站部署到 Cloudflare Pages。
# 需要在 GitHub 儲存庫的 Settings → Secrets and variables → Actions 新增兩個 Secret：
#   CLOUDFLARE_API_TOKEN   （權限：帳戶 → Cloudflare Pages → 編輯）
#   CLOUDFLARE_ACCOUNT_ID
# Pages 專案名稱是下面的 PROJECT；要換名字改這一行就好。
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

env:
  PROJECT: mangaki

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: 檢查 Secret 是否已設定
        id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::尚未設定 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID，已略過部署。"
            exit 0
          fi
          # 只檢查格式、只印出長度，不會把內容印出來
          if ! printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -Eq '^[0-9a-f]{32}$'; then
            echo "::error title=CLOUDFLARE_ACCOUNT_ID 格式不對::帳戶 ID 應該剛好 32 個字元（只有 0-9 和 a-f）。目前是 ${#CLOUDFLARE_ACCOUNT_ID} 個字元。常見原因：貼成了別的 ID（例如網域的 Zone ID）、前後有空白或換行、或跟權杖貼反了。"
            exit 1
          fi
          if ! printf '%s' "$CLOUDFLARE_API_TOKEN" | grep -Eq '^[A-Za-z0-9_-]{30,120}$'; then
            echo "::error title=CLOUDFLARE_API_TOKEN 格式不對::權杖只應包含英數字、底線和減號，長度約 40 個字元。目前是 ${#CLOUDFLARE_API_TOKEN} 個字元。常見原因：前後有空白或換行、或複製不完整。"
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: 整理要上傳的檔案（只放網站需要的，不含 tools 等開發檔）
        if: steps.check.outputs.ready == 'true'
        run: |
          mkdir dist
          cp index.html manifest.json sw.js tailwind.css version.json icon.png icon.svg dist/
          cp -r css js dist/

      - name: 部署到 Cloudflare Pages
        if: steps.check.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          # 專案還不存在就建立（已存在時這行會回報錯誤，直接忽略）
          npx --yes wrangler@3 pages project create "$PROJECT" --production-branch=main > create.log 2>&1
          npx --yes wrangler@3 pages deploy dist --project-name="$PROJECT" --branch=main > deploy.log 2>&1
          code=$?
          cat create.log deploy.log
          if [ "$code" -ne 0 ]; then
            # 把 wrangler 的錯誤寫成註解，在 Actions 頁面最上方就看得到
            esc() { tail -n "$2" "$1" | tr -d '\r' | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}'; }
            echo "::error title=wrangler pages deploy 失敗::$(esc deploy.log 25)"
            echo "::warning title=wrangler pages project create::$(esc create.log 6)"
            exit "$code"
          fi

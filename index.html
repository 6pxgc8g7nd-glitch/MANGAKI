<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TOPTOON 漫畫紀錄網</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #074732;
            color: #ffffff;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        /* Mobile App Frame Styling */
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            background-color: #0b5c42;
            box-shadow: 0 0 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            position: relative;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #084732;
        }
        ::-webkit-scrollbar-thumb {
            background: #147a57;
            border-radius: 2px;
        }
    </style>
</head>
<body class="bg-[#074732] flex justify-center">

    <div class="app-container">

        <!-- Top Header -->
        <header class="w-full py-3.5 px-4 bg-[#094c36] shadow-md flex items-center justify-between sticky top-0 z-50 border-b border-[#147a57]/50">
            <div class="flex items-center space-x-2">
                <h1 class="text-xl font-black tracking-wider">
                    <span class="text-red-600">TOP</span><span class="text-white">TOON</span>
                </h1>
                <span class="text-[10px] bg-[#147a57] px-2 py-0.5 rounded-full text-emerald-200 font-medium">漫畫追蹤</span>
            </div>
            <div class="flex items-center space-x-2.5">
                <button onclick="openSearchModal()" class="w-8 h-8 rounded-full bg-[#0b5c42] flex items-center justify-center hover:bg-[#147a57] active:scale-95 transition">
                    <i class="fa-solid fa-search text-emerald-200 text-xs"></i>
                </button>
                <button onclick="openNotificationModal()" class="w-8 h-8 rounded-full bg-[#0b5c42] flex items-center justify-center hover:bg-[#147a57] active:scale-95 transition relative">
                    <i class="fa-solid fa-bell text-emerald-200 text-xs"></i>
                    <span id="notifBadge" class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full hidden"></span>
                </button>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="flex-1 w-full p-3.5 pb-28 overflow-y-auto">

            <!-- TAB 1: 首頁 (Home) -->
            <section id="tab-home" class="space-y-4">
                <!-- Filter Pills -->
                <div class="flex items-center space-x-2 overflow-x-auto pb-1 scrollbar-none pt-1">
                    <button onclick="filterComics('all')" id="filter-all" class="filter-btn px-3.5 py-1.5 rounded-full text-xs font-medium bg-emerald-700 text-white shadow transition whitespace-nowrap active:scale-95">全部</button>
                    <button onclick="filterComics('reading')" id="filter-reading" class="filter-btn px-3.5 py-1.5 rounded-full text-xs font-medium bg-[#084934] text-emerald-200 hover:bg-[#147a57] transition whitespace-nowrap active:scale-95">連載中</button>
                    <button onclick="filterComics('completed')" id="filter-completed" class="filter-btn px-3.5 py-1.5 rounded-full text-xs font-medium bg-[#084934] text-emerald-200 hover:bg-[#147a57] transition whitespace-nowrap active:scale-95">已完結</button>
                    <button onclick="filterComics('wishlist')" id="filter-wishlist" class="filter-btn px-3.5 py-1.5 rounded-full text-xs font-medium bg-[#084934] text-emerald-200 hover:bg-[#147a57] transition whitespace-nowrap active:scale-95">想看</button>
                </div>

                <!-- Comic List -->
                <div class="space-y-2.5">
                    <div class="flex justify-between items-center px-1">
                        <h3 class="font-bold text-xs text-emerald-200/90 flex items-center space-x-1.5 uppercase tracking-wide">
                            <i class="fa-solid fa-bookmark text-red-500 text-xs"></i>
                            <span>我的漫畫清單</span>
                        </h3>
                        <span id="comicCount" class="text-[11px] text-emerald-200/60 font-medium">共 0 部</span>
                    </div>
                    <div id="comicListContainer" class="grid grid-cols-1 gap-2.5">
                        <!-- Dynamic Comics injected here -->
                    </div>
                </div>
            </section>

            <!-- TAB 2: 分類 (Categories) -->
            <section id="tab-categories" class="hidden space-y-4">
                <div class="bg-[#084934] rounded-xl p-4 shadow border border-[#147a57]/40">
                    <h2 class="text-base font-bold mb-1">漫畫分類瀏覽</h2>
                    <p class="text-xs text-emerald-200/80">依據不同題材與狀態探索收藏作品</p>
                </div>

                <!-- Genre Grid -->
                <div class="grid grid-cols-2 gap-2.5" id="genreGrid">
                    <div onclick="selectGenre('全部')" class="genre-card bg-[#084934] p-3 rounded-xl border border-emerald-600/30 hover:border-emerald-400 cursor-pointer transition flex items-center justify-between active:scale-[0.98]">
                        <span class="font-bold text-xs">全部題材</span>
                        <i class="fa-solid fa-layer-group text-emerald-400 text-xs"></i>
                    </div>
                    <div onclick="selectGenre('戀愛')" class="genre-card bg-[#084934] p-3 rounded-xl border border-emerald-600/30 hover:border-emerald-400 cursor-pointer transition flex items-center justify-between active:scale-[0.98]">
                        <span class="font-bold text-xs">💕 戀愛 / 校園</span>
                        <i class="fa-solid fa-chevron-right text-[10px] text-emerald-400"></i>
                    </div>
                    <div onclick="selectGenre('動作')" class="genre-card bg-[#084934] p-3 rounded-xl border border-emerald-600/30 hover:border-emerald-400 cursor-pointer transition flex items-center justify-between active:scale-[0.98]">
                        <span class="font-bold text-xs">🔥 動作 / 冒險</span>
                        <i class="fa-solid fa-chevron-right text-[10px] text-emerald-400"></i>
                    </div>
                    <div onclick="selectGenre('奇幻')" class="genre-card bg-[#084934] p-3 rounded-xl border border-emerald-600/30 hover:border-emerald-400 cursor-pointer transition flex items-center justify-between active:scale-[0.98]">
                        <span class="font-bold text-xs">✨ 奇幻 / 異世界</span>
                        <i class="fa-solid fa-chevron-right text-[10px] text-emerald-400"></i>
                    </div>
                    <div onclick="selectGenre('懸疑')" class="genre-card bg-[#084934] p-3 rounded-xl border border-emerald-600/30 hover:border-emerald-400 cursor-pointer transition flex items-center justify-between active:scale-[0.98]">
                        <span class="font-bold text-xs">🔪 懸疑 / 驚悚</span>
                        <i class="fa-solid fa-chevron-right text-[10px] text-emerald-400"></i>
                    </div>
                    <div onclick="selectGenre('搞笑')" class="genre-card bg-[#084934] p-3 rounded-xl border border-emerald-600/30 hover:border-emerald-400 cursor-pointer transition flex items-center justify-between active:scale-[0.98]">
                        <span class="font-bold text-xs">😂 搞笑 / 日常</span>
                        <i class="fa-solid fa-chevron-right text-[10px] text-emerald-400"></i>
                    </div>
                </div>

                <!-- Filtered List per Genre with Sub-filters -->
                <div class="space-y-2.5 pt-1">
                    <div class="flex flex-col gap-2">
                        <h3 id="genreTitle" class="font-bold text-xs text-emerald-100 flex items-center space-x-1.5">
                            <i class="fa-solid fa-tag text-emerald-400 text-xs"></i>
                            <span>分類檢視：全部題材</span>
                        </h3>
                        <!-- Secondary Status Filters (Sub-tabs) -->
                        <div class="flex items-center space-x-1 overflow-x-auto pb-1 scrollbar-none">
                            <button onclick="filterGenreStatus('all')" id="genre-sub-all" class="genre-sub-btn px-3 py-1 rounded-full text-[11px] font-medium bg-emerald-700 text-white shadow transition whitespace-nowrap active:scale-95">全部狀態</button>
                            <button onclick="filterGenreStatus('reading')" id="genre-sub-reading" class="genre-sub-btn px-3 py-1 rounded-full text-[11px] font-medium bg-[#084934] text-emerald-200 hover:bg-[#147a57] transition whitespace-nowrap active:scale-95">連載中</button>
                            <button onclick="filterGenreStatus('completed')" id="genre-sub-completed" class="genre-sub-btn px-3 py-1 rounded-full text-[11px] font-medium bg-[#084934] text-emerald-200 hover:bg-[#147a57] transition whitespace-nowrap active:scale-95">已完結</button>
                            <button onclick="filterGenreStatus('wishlist')" id="genre-sub-wishlist" class="genre-sub-btn px-3 py-1 rounded-full text-[11px] font-medium bg-[#084934] text-emerald-200 hover:bg-[#147a57] transition whitespace-nowrap active:scale-95">想看</button>
                        </div>
                    </div>
                    <div id="genreComicList" class="grid grid-cols-1 gap-2.5">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </section>

            <!-- TAB 3: 新增 (Add) -->
            <section id="tab-add" class="hidden space-y-4">
                <div class="bg-[#084934] rounded-2xl p-4 shadow-lg border border-[#147a57]/50 flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-red-600/20 text-red-400 flex items-center justify-center text-lg border border-red-500/30 flex-shrink-0">
                        <i class="fa-solid fa-circle-plus"></i>
                    </div>
                    <div>
                        <h2 class="text-sm font-black tracking-wide text-white">新增漫畫紀錄</h2>
                        <p class="text-[11px] text-emerald-200/70">記錄漫畫名稱、作者、網址與封面</p>
                    </div>
                </div>

                <form id="addComicForm" onsubmit="handleAddNewComic(event)" class="bg-[#084934] rounded-2xl p-4 shadow-lg border border-[#147a57]/50 space-y-3.5">
                    <div>
                        <label class="block text-[11px] font-bold text-emerald-200 mb-1 flex items-center space-x-1">
                            <i class="fa-solid fa-book text-emerald-400 text-[10px]"></i>
                            <span>漫畫名稱 *</span>
                        </label>
                        <input type="text" id="inputTitle" required placeholder="例如：我獨自升級" class="w-full bg-[#0b5c42] border border-emerald-600/40 rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-emerald-400/40 focus:outline-none focus:border-emerald-400 transition shadow-inner">
                    </div>

                    <div>
                        <label class="block text-[11px] font-bold text-emerald-200 mb-1 flex items-center space-x-1">
                            <i class="fa-solid fa-pen-nib text-emerald-400 text-[10px]"></i>
                            <span>作者</span>
                        </label>
                        <input type="text" id="inputAuthor" placeholder="例如：Chugong" class="w-full bg-[#0b5c42] border border-emerald-600/40 rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-emerald-400/40 focus:outline-none focus:border-emerald-400 transition shadow-inner">
                    </div>

                    <div>
                        <label class="block text-[11px] font-bold text-emerald-200 mb-1 flex items-center space-x-1">
                            <i class="fa-solid fa-link text-emerald-400 text-[10px]"></i>
                            <span>網址</span>
                        </label>
                        <input type="url" id="inputUrl" placeholder="https://..." class="w-full bg-[#0b5c42] border border-emerald-600/40 rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-emerald-400/40 focus:outline-none focus:border-emerald-400 transition shadow-inner">
                    </div>

                    <div>
                        <label class="block text-[11px] font-bold text-emerald-200 mb-1 flex items-center space-x-1">
                            <i class="fa-solid fa-image text-emerald-400 text-[10px]"></i>
                            <span>封面網址</span>
                        </label>
                        <input type="url" id="inputCoverUrl" placeholder="https://... (圖片連結)" class="w-full bg-[#0b5c42] border border-emerald-600/40 rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-emerald-400/40 focus:outline-none focus:border-emerald-400 transition shadow-inner">
                    </div>

                    <button type="submit" class="w-full bg-red-600 hover:bg-red-700 active:scale-95 text-white font-bold py-3 rounded-xl shadow-lg transition flex items-center justify-center space-x-2 text-xs">
                        <i class="fa-solid fa-plus text-xs"></i>
                        <span>確認新增漫畫</span>
                    </button>
                </form>
            </section>

            <!-- TAB 4: 設定 (Settings) -->
            <section id="tab-settings" class="hidden space-y-4">
                <div class="bg-[#084934] rounded-xl p-4 shadow border border-[#147a57]/40">
                    <h2 class="text-base font-bold mb-0.5">系統設定與管理</h2>
                    <p class="text-xs text-emerald-200/80">管理您的漫畫紀錄資料與偏好設定</p>
                </div>

                <div class="bg-[#084934] rounded-xl p-3.5 shadow border border-[#147a57]/40 space-y-2.5">
                    <h3 class="font-bold text-emerald-200 border-b border-[#147a57] pb-1.5 text-xs">資料管理</h3>
                    <button onclick="exportData()" class="w-full text-left px-3.5 py-2.5 bg-[#0b5c42] hover:bg-[#147a57] active:scale-[0.98] rounded-xl flex items-center justify-between transition text-xs">
                        <div class="flex items-center space-x-2.5">
                            <i class="fa-solid fa-file-arrow-down text-emerald-400"></i>
                            <span>匯出備份 (JSON)</span>
                        </div>
                        <i class="fa-solid fa-chevron-right text-[10px] text-emerald-400"></i>
                    </button>
                    <label class="w-full text-left px-3.5 py-2.5 bg-[#0b5c42] hover:bg-[#147a57] active:scale-[0.98] rounded-xl flex items-center justify-between transition cursor-pointer text-xs">
                        <div class="flex items-center space-x-2.5">
                            <i class="fa-solid fa-file-arrow-up text-emerald-400"></i>
                            <span>匯入還原資料</span>
                        </div>
                        <input type="file" id="importFile" accept=".json" onchange="importData(event)" class="hidden">
                        <i class="fa-solid fa-chevron-right text-[10px] text-emerald-400"></i>
                    </label>
                    <button onclick="clearAllData()" class="w-full text-left px-3.5 py-2.5 bg-[#0b5c42] hover:bg-red-800/40 active:scale-[0.98] rounded-xl flex items-center justify-between transition text-red-400 text-xs">
                        <div class="flex items-center space-x-2.5">
                            <i class="fa-solid fa-trash-can"></i>
                            <span>清除所有資料</span>
                        </div>
                        <i class="fa-solid fa-chevron-right text-[10px]"></i>
                    </button>
                </div>

                <div class="bg-[#084934] rounded-xl p-3.5 shadow border border-[#147a57]/40 space-y-2">
                    <h3 class="font-bold text-emerald-200 border-b border-[#147a57] pb-1.5 text-xs">關於 TOPTOON 紀錄網</h3>
                    <div class="text-[11px] text-emerald-200/80 space-y-1">
                        <p>版本：v1.3.0 (Mobile Web Edition)</p>
                        <p>特色：專為手機版深度優化的漫畫追蹤介面，隨時記錄喜愛作品。</p>
                    </div>
                </div>
            </section>

        </main>

        <!-- Bottom Navigation Bar (Floating with Rounded Corners) -->
        <nav class="absolute bottom-3 left-3 right-3 bg-[#07422f] border border-white/20 z-40 max-w-[480px] mx-auto shadow-2xl rounded-2xl overflow-hidden">
            <div class="grid grid-cols-4 h-14 text-center">
                <!-- Tab 1: 首頁 -->
                <button onclick="switchTab('home')" id="nav-home" class="nav-btn flex flex-col items-center justify-center border-r border-white/20 text-white font-bold transition active:bg-[#0a523a]">
                    <i class="fa-solid fa-house text-sm mb-0.5"></i>
                    <span class="text-[10px]">首頁</span>
                </button>
                <!-- Tab 2: 分類 -->
                <button onclick="switchTab('categories')" id="nav-categories" class="nav-btn flex flex-col items-center justify-center border-r border-white/20 text-emerald-300/70 font-medium transition active:bg-[#0a523a]">
                    <i class="fa-solid fa-compass text-sm mb-0.5"></i>
                    <span class="text-[10px]">分類</span>
                </button>
                <!-- Tab 3: 新增 -->
                <button onclick="switchTab('add')" id="nav-add" class="nav-btn flex flex-col items-center justify-center border-r border-white/20 text-emerald-300/70 font-medium transition active:bg-[#0a523a]">
                    <i class="fa-solid fa-circle-plus text-sm mb-0.5"></i>
                    <span class="text-[10px]">新增</span>
                </button>
                <!-- Tab 4: 設定 -->
                <button onclick="switchTab('settings')" id="nav-settings" class="nav-btn flex flex-col items-center justify-center text-emerald-300/70 font-medium transition active:bg-[#0a523a]">
                    <i class="fa-solid fa-gear text-sm mb-0.5"></i>
                    <span class="text-[10px]">設定</span>
                </button>
            </div>
        </nav>

        <!-- Comic Detail Modal -->
        <div id="comicModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3">
            <div class="bg-[#084934] border border-[#147a57] rounded-xl w-full max-w-sm p-4 shadow-2xl relative space-y-3 max-h-[85vh] overflow-y-auto">
                <button onclick="closeComicModal()" class="absolute top-3 right-3 text-emerald-300 hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
                <div class="flex items-center space-x-3 pr-6">
                    <div id="modalEmojiContainer" class="w-12 h-12 bg-[#0b5c42] rounded-xl flex items-center justify-center text-2xl border border-emerald-600/40 shadow-inner flex-shrink-0 overflow-hidden">
                        📖
                    </div>
                    <div>
                        <h3 id="modalTitle" class="text-base font-bold">漫畫名稱</h3>
                        <p id="modalAuthor" class="text-[11px] text-emerald-200/80">作者</p>
                    </div>
                </div>

                <div id="modalUrlBox" class="hidden">
                    <a id="modalUrlLink" href="#" target="_blank" class="w-full bg-red-600 hover:bg-red-700 active:scale-95 text-white py-2.5 rounded-lg font-bold transition text-xs flex items-center justify-center space-x-2 shadow">
                        <i class="fa-solid fa-external-link-alt text-xs"></i>
                        <span>前往漫畫網站閱讀</span>
                    </a>
                </div>

                <div class="flex space-x-2 pt-2">
                    <button onclick="deleteCurrentComic()" class="flex-1 bg-red-900/60 hover:bg-red-800 active:scale-95 text-red-200 py-2.5 rounded-lg font-bold transition text-xs flex items-center justify-center space-x-1 border border-red-700/40">
                        <i class="fa-solid fa-trash-can text-xs"></i>
                        <span>刪除紀錄</span>
                    </button>
                    <button onclick="closeComicModal()" class="flex-1 bg-[#0b5c42] hover:bg-[#147a57] active:scale-95 text-white py-2.5 rounded-lg font-bold transition text-xs border border-emerald-600/40">
                        關閉
                    </button>
                </div>
            </div>
        </div>

        <!-- Search Modal -->
        <div id="searchModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-start justify-center pt-12 p-3">
            <div class="bg-[#084934] border border-[#147a57] rounded-xl w-full max-w-sm p-4 shadow-2xl relative space-y-3">
                <div class="flex items-center space-x-2.5 bg-[#0b5c42] px-3 py-2 rounded-lg border border-emerald-600/40">
                    <i class="fa-solid fa-search text-emerald-300 text-xs"></i>
                    <input type="text" id="searchInput" oninput="handleSearchInput(event)" placeholder="輸入漫畫標題或作者搜尋..." class="w-full bg-transparent text-white placeholder-emerald-400/50 focus:outline-none text-xs">
                    <button onclick="closeSearchModal()" class="text-emerald-300 hover:text-white p-1">
                        <i class="fa-solid fa-xmark text-xs"></i>
                    </button>
                </div>
                <div id="searchResults" class="space-y-1.5 max-h-[50vh] overflow-y-auto">
                    <!-- Search results -->
                </div>
            </div>
        </div>

        <!-- Notification / Message Box Modal -->
        <div id="msgModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3">
            <div class="bg-[#084934] border border-[#147a57] rounded-xl w-full max-w-[280px] p-4 shadow-2xl text-center space-y-3">
                <div id="msgIcon" class="w-10 h-10 rounded-full bg-emerald-600/30 text-emerald-300 flex items-center justify-center mx-auto text-base">
                    <i class="fa-solid fa-check"></i>
                </div>
                <h3 id="msgTitle" class="font-bold text-sm">提示訊息</h3>
                <p id="msgText" class="text-xs text-emerald-200/80">操作成功</p>
                <button onclick="closeMsgModal()" class="w-full bg-red-600 hover:bg-red-700 active:scale-95 text-white font-bold py-2 rounded-lg transition text-xs">確定</button>
            </div>
        </div>

    </div>

    <script>
        // State Management (Starts completely empty)
        let comics = JSON.parse(localStorage.getItem('toptoon_comics')) || [];

        let currentFilter = 'all';
        let currentGenre = '全部';
        let currentGenreStatus = 'all';
        let activeComicId = null;

        // Save to localStorage
        function saveComics() {
            localStorage.setItem('toptoon_comics', JSON.stringify(comics));
        }

        // Tab Navigation
        function switchTab(tabName) {
            document.querySelectorAll('.app-container > main > section').forEach(sec => sec.classList.add('hidden'));
            document.getElementById(`tab-${tabName}`).classList.remove('hidden');

            // Update bottom nav styling
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-white', 'font-bold');
                btn.classList.add('text-emerald-300/70', 'font-medium');
            });
            const activeBtn = document.getElementById(`nav-${tabName}`);
            activeBtn.classList.remove('text-emerald-300/70', 'font-medium');
            activeBtn.classList.add('text-white', 'font-bold');

            // Render views if needed
            if(tabName === 'home') renderComics();
            if(tabName === 'categories') renderGenreComics();
        }

        // Render Home Comic List
        function renderComics() {
            const container = document.getElementById('comicListContainer');
            let filtered = comics;

            if (currentFilter !== 'all') {
                filtered = comics.filter(c => c.status === currentFilter);
            }

            document.getElementById('comicCount').innerText = `共 ${filtered.length} 部`;

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="bg-[#084934] rounded-xl p-6 text-center border border-emerald-600/30 text-emerald-200/60 space-y-2">
                        <i class="fa-solid fa-box-open text-2xl"></i>
                        <p class="text-xs">目前沒有符合條件的漫畫紀錄</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(comic => {
                const statusBadge = comic.status === 'reading' ? '<span class="text-[10px] bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded-full font-medium">連載中</span>' :
                                    comic.status === 'completed' ? '<span class="text-[10px] bg-sky-500/20 text-sky-300 px-2 py-0.5 rounded-full font-medium">已完結</span>' :
                                    '<span class="text-[10px] bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded-full font-medium">想看</span>';

                const coverDisplay = comic.coverUrl ? 
                    `<img src="${comic.coverUrl}" class="w-12 h-12 object-cover rounded-lg border border-emerald-600/40 shadow-inner flex-shrink-0" onerror="this.onerror=null; this.parentElement.innerHTML='<span class=\'text-xl\'>📖</span>'">` :
                    `<div class="w-12 h-12 bg-[#0b5c42] rounded-lg flex items-center justify-center text-xl border border-emerald-600/40 shadow-inner flex-shrink-0">${comic.emoji || '📖'}</div>`;

                return `
                    <div onclick="openComicModal('${comic.id}')" class="bg-[#084934] hover:bg-[#0a523a] border border-emerald-600/30 hover:border-emerald-400 p-3 rounded-xl shadow transition cursor-pointer flex items-center justify-between active:scale-[0.98]">
                        <div class="flex items-center space-x-3">
                            ${coverDisplay}
                            <div class="space-y-0.5">
                                <div class="flex items-center space-x-1.5 flex-wrap">
                                    <h4 class="font-bold text-white text-xs">${comic.title}</h4>
                                    ${statusBadge}
                                </div>
                                <p class="text-[10px] text-emerald-200/70">作者：${comic.author || '未填寫'}</p>
                            </div>
                        </div>
                        <div class="text-emerald-400/70 px-1">
                            <i class="fa-solid fa-chevron-right text-xs"></i>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Filter buttons on home
        function filterComics(status) {
            currentFilter = status;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.className = "filter-btn px-3.5 py-1.5 rounded-full text-xs font-medium bg-[#084934] text-emerald-200 hover:bg-[#147a57] transition whitespace-nowrap active:scale-95";
            });
            document.getElementById(`filter-${status}`).className = "filter-btn px-3.5 py-1.5 rounded-full text-xs font-medium bg-emerald-700 text-white shadow transition whitespace-nowrap active:scale-95";
            renderComics();
        }

        // Categories handling
        function selectGenre(genre) {
            currentGenre = genre;
            renderGenreComics();
        }

        function filterGenreStatus(status) {
            currentGenreStatus = status;
            document.querySelectorAll('.genre-sub-btn').forEach(btn => {
                btn.className = "genre-sub-btn px-3 py-1 rounded-full text-[11px] font-medium bg-[#084934] text-emerald-200 hover:bg-[#147a57] transition whitespace-nowrap active:scale-95";
            });
            document.getElementById(`genre-sub-${status}`).className = "genre-sub-btn px-3 py-1 rounded-full text-[11px] font-medium bg-emerald-700 text-white shadow transition whitespace-nowrap active:scale-95";
            renderGenreComics();
        }

        function renderGenreComics() {
            const container = document.getElementById('genreComicList');
            let filtered = currentGenre === '全部' ? comics : comics.filter(c => c.genre === currentGenre);

            if (currentGenreStatus !== 'all') {
                filtered = filtered.filter(c => c.status === currentGenreStatus);
            }

            document.getElementById('genreTitle').innerHTML = `<i class="fa-solid fa-tag text-emerald-400 text-xs"></i><span>分類檢視：${currentGenre} (${filtered.length} 部)</span>`;

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="bg-[#084934] rounded-xl p-4 text-center border border-emerald-600/30 text-emerald-200/60 text-xs">
                        此分類與狀態下尚無漫畫紀錄
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(comic => {
                const coverDisplay = comic.coverUrl ? 
                    `<img src="${comic.coverUrl}" class="w-10 h-10 object-cover rounded-lg border border-emerald-600/40 shadow-inner flex-shrink-0" onerror="this.onerror=null; this.parentElement.innerHTML='<span>📖</span>'">` :
                    `<span class="text-lg">${comic.emoji || '📖'}</span>`;

                return `
                    <div onclick="openComicModal('${comic.id}')" class="bg-[#084934] hover:bg-[#0a523a] border border-emerald-600/30 p-3 rounded-xl shadow cursor-pointer flex items-center justify-between active:scale-[0.98]">
                        <div class="flex items-center space-x-2.5">
                            ${coverDisplay}
                            <div>
                                <h5 class="font-bold text-white text-xs">${comic.title}</h5>
                                <p class="text-[10px] text-emerald-200/70">作者：${comic.author || '未填寫'}</p>
                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-right text-xs text-emerald-300"></i>
                    </div>
                `;
            }).join('');
        }

        // Add new comic
        function handleAddNewComic(e) {
            e.preventDefault();
            const newComic = {
                id: Date.now().toString(),
                title: document.getElementById('inputTitle').value,
                author: document.getElementById('inputAuthor').value,
                url: document.getElementById('inputUrl').value,
                coverUrl: document.getElementById('inputCoverUrl').value,
                genre: '動作',
                status: 'reading',
                rating: '5',
                emoji: '📖'
            };

            comics.unshift(newComic);
            saveComics();
            document.getElementById('addComicForm').reset();
            showMsg('新增成功', '已成功將漫畫加入追蹤清單！');
            switchTab('home');
        }

        // Comic Modal Details
        function openComicModal(id) {
            activeComicId = id;
            const comic = comics.find(c => c.id === id);
            if (!comic) return;

            const modalEmojiContainer = document.getElementById('modalEmojiContainer');
            if (comic.coverUrl) {
                modalEmojiContainer.innerHTML = `<img src="${comic.coverUrl}" class="w-full h-full object-cover" onerror="this.onerror=null; this.parentElement.innerHTML='📖'">`;
            } else {
                modalEmojiContainer.innerText = comic.emoji || '📖';
            }

            document.getElementById('modalTitle').innerText = comic.title;
            document.getElementById('modalAuthor').innerText = `作者：${comic.author || '未填寫'}`;

            const urlBox = document.getElementById('modalUrlBox');
            const urlLink = document.getElementById('modalUrlLink');
            if (comic.url && comic.url.trim() !== '') {
                urlLink.href = comic.url;
                urlBox.classList.remove('hidden');
            } else {
                urlBox.classList.add('hidden');
            }

            document.getElementById('comicModal').classList.remove('hidden');
        }

        function closeComicModal() {
            document.getElementById('comicModal').classList.add('hidden');
            activeComicId = null;
            renderComics();
        }

        function deleteCurrentComic() {
            comics = comics.filter(c => c.id !== activeComicId);
            saveComics();
            closeComicModal();
            showMsg('刪除成功', '已從清單中移除該漫畫。');
        }

        // Search Modal
        function openSearchModal() {
            document.getElementById('searchModal').classList.remove('hidden');
            document.getElementById('searchInput').focus();
            renderSearchResults('');
        }

        function closeSearchModal() {
            document.getElementById('searchModal').classList.add('hidden');
        }

        function handleSearchInput(e) {
            renderSearchResults(e.target.value.toLowerCase());
        }

        function renderSearchResults(keyword) {
            const container = document.getElementById('searchResults');
            const filtered = comics.filter(c => c.title.toLowerCase().includes(keyword) || (c.author && c.author.toLowerCase().includes(keyword)));

            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center text-emerald-200/60 py-3 text-xs">找不到相關漫畫</div>`;
                return;
            }

            container.innerHTML = filtered.map(comic => {
                const coverDisplay = comic.coverUrl ? 
                    `<img src="${comic.coverUrl}" class="w-8 h-8 object-cover rounded-lg border border-emerald-600/40 shadow-inner flex-shrink-0" onerror="this.onerror=null; this.parentElement.innerHTML='<span>📖</span>'">` :
                    `<span class="text-lg">${comic.emoji || '📖'}</span>`;

                return `
                    <div onclick="closeSearchModal(); openComicModal('${comic.id}');" class="bg-[#0b5c42] hover:bg-[#147a57] p-2.5 rounded-lg cursor-pointer flex items-center justify-between transition active:scale-[0.98]">
                        <div class="flex items-center space-x-2.5">
                            ${coverDisplay}
                            <div>
                                <h5 class="font-bold text-xs">${comic.title}</h5>
                                <p class="text-[10px] text-emerald-200/70">作者：${comic.author || '未填寫'}</p>
                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-right text-[10px] text-emerald-300"></i>
                    </div>
                `;
            }).join('');
        }

        // Notification Modal
        function openNotificationModal() {
            showMsg('系統通知', '目前沒有未讀的漫畫更新通知。');
        }

        function showMsg(title, text) {
            document.getElementById('msgTitle').innerText = title;
            document.getElementById('msgText').innerText = text;
            document.getElementById('msgModal').classList.remove('hidden');
        }

        function closeMsgModal() {
            document.getElementById('msgModal').classList.add('hidden');
        }

        // Settings Data Functions
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(comics, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "toptoon_backup.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showMsg('匯出成功', '漫畫紀錄備份檔案已成功下載！');
        }

        function importData(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const parsed = JSON.parse(event.target.result);
                    if (Array.isArray(parsed)) {
                        comics = parsed;
                        saveComics();
                        renderComics();
                        showMsg('還原成功', '已成功載入備份資料！');
                    } else {
                        showMsg('格式錯誤', '檔案格式不符，無法還原。');
                    }
                } catch(err) {
                    showMsg('解析失敗', 'JSON 檔案解析發生錯誤。');
                }
            };
            reader.readAsText(file);
        }

        function clearAllData() {
            if (confirm("確定要清除所有漫畫紀錄嗎？此動作無法復原。") !== false) {
                comics = [];
                saveComics();
                renderComics();
                showMsg('清除完成', '所有漫畫紀錄已被清空。');
            }
        }

        // Initialize on load
        window.onload = function() {
            renderComics();
        }
    </script>
</body>
</html>

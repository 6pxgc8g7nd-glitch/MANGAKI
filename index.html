<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="MANGAKI">
    <meta name="theme-color" content="#ffd400">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>漫記 MANGAKI 漫畫紀錄</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f5f5f5;
            color: #171717;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        /* Mobile App Frame Styling */
        .app-container {
            max-width: 480px;
            width: 100%;
            height: 100dvh;
            margin: 0 auto;
            background-color: #fafafa;
            box-shadow: 0 0 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #f0f0f0;
        }
        ::-webkit-scrollbar-thumb {
            background: #e5e5e5;
            border-radius: 2px;
        }

        /* ===== 漫畫風格：粗黑邊框 + 硬陰影 + 網點底 + 紅黃配色 ===== */
        :root {
            --ink: #111111;
            --red: #a6051a;
            --yellow: #ffd400;
            --paper: #fff8dc;
        }
        body {
            background-color: var(--yellow) !important;
            background-image: radial-gradient(rgba(0,0,0,0.18) 1.2px, transparent 1.4px);
            background-size: 9px 9px;
        }
        .app-container {
            background-color: var(--paper) !important;
            background-image: radial-gradient(rgba(166,5,26,0.10) 1.2px, transparent 1.4px);
            background-size: 9px 9px;
            box-shadow: 0 0 0 3px var(--ink), 8px 8px 0 var(--ink) !important;
        }
        ::-webkit-scrollbar-track { background: var(--paper); }
        ::-webkit-scrollbar-thumb { background: var(--ink); }

        /* 標題列 */
        .app-container > header {
            background: var(--yellow) !important;
            border-bottom: 3px solid var(--ink) !important;
            box-shadow: none !important;
        }
        .app-container > header h1 {
            font-weight: 900;
            font-size: clamp(1.5rem, 7.4vw, 1.95rem);
            line-height: 1.15;
            letter-spacing: 0.06em;
            text-shadow: 2px 2px 0 var(--ink);
        }
        .app-container > header h1 span:first-child { color: #ffffff !important; }
        .app-container > header h1 span:last-child { color: var(--red) !important; }

        /* 白色圓角卡片（漫畫格） */
        .app-container [class*="bg-[#ffffff]"][class*="rounded-xl"] {
            border: 2.5px solid var(--ink) !important;
            box-shadow: 4px 4px 0 var(--ink) !important;
        }
        .cover-box { aspect-ratio: 3 / 4; }
        .app-container .cover-box {
            border-bottom: 2.5px solid var(--ink);
        }
        [data-id].group:active, .genre-card:active { transform: translate(2px, 2px) !important; box-shadow: 2px 2px 0 var(--ink) !important; }

        /* 所有紅色細邊框改成黑色 */
        .app-container [class*="border-[#a6051a]/40"] { border-color: var(--ink) !important; border-width: 2px !important; }
        .app-container [class*="border-[#a6051a]/30"] { border-color: var(--ink) !important; }
        .app-container .genre-card[class*="ring-"] { background: var(--yellow) !important; box-shadow: 4px 4px 0 var(--red) !important; }

        /* 輸入框 */
        .app-container input[type="text"], .app-container input[type="url"], .app-container input[type="number"], .app-container input[type="date"], .app-container input[type="password"] {
            background: #ffffff !important;
            box-shadow: none !important;
            border: 2px solid var(--ink) !important;
            font-weight: 700;
        }
        .app-container select { display: none !important; }
        .app-container select-old { -webkit-appearance: none; appearance: none; min-height: 40px; background: #ffffff !important; border: 2px solid var(--ink) !important; box-shadow: none !important; font-weight: 700; background-image: none; }
        .app-container input:focus { box-shadow: 3px 3px 0 var(--red) !important; }
        .app-container label[class*="bg-[#fafafa]"] { background: #ffffff !important; box-shadow: none !important; }

        /* 紅色主要按鈕 */
        .app-container button[class*="bg-[#a6051a]"]:not(.nav-btn),
        .app-container a[class*="bg-[#a6051a]"] {
            border: 2.5px solid var(--ink) !important;
            box-shadow: 3px 3px 0 var(--ink) !important;
            font-weight: 900;
        }
        .app-container button[class*="bg-[#a6051a]"]:not(.nav-btn):active,
        .app-container a[class*="bg-[#a6051a]"]:active { box-shadow: 1px 1px 0 var(--ink) !important; }
        /* 次要按鈕 */
        .app-container button[class*="bg-[#fafafa]"], .app-container label.cursor-pointer[class*="bg-[#fafafa]"],
        .app-container button[class*="bg-white"], .app-container button[class*="bg-gray-700"] {
            box-shadow: 3px 3px 0 var(--ink) !important;
        }
        .app-container button[class*="bg-gray-700"] { background: var(--ink) !important; }
        .app-container button[class*="bg-white"][class*="text-[#a6051a]"] { color: var(--red) !important; }
        .app-container button:disabled { box-shadow: none !important; opacity: 0.5; }

        /* 狀態標籤 */
        .app-container [class*="text-[9px]"] {
            border: 2px solid var(--ink) !important;
            font-weight: 900;
            background: var(--yellow) !important;
            color: var(--ink) !important;
        }
        .app-container [class*="bg-gray-200"] { background: #e5e5e5 !important; }

        /* 底部導覽列：黑底 + 黃色選中 */
        .app-container > nav {
            background: var(--ink) !important;
            border: 3px solid var(--ink);
            box-shadow: 4px 4px 0 var(--red) !important;
        }
        .app-container > nav .nav-btn { color: rgba(255,255,255,0.55) !important; }
        .app-container > nav .nav-btn.text-white { color: var(--yellow) !important; }
        .app-container > nav .nav-btn.text-white i { transform: translateY(-1px) scale(1.15); }


        /* 標題列裝飾：放射速度線 + 網點漸層 + 驚嘆爆炸框 */
        .app-container > header {
            position: relative;
            overflow: hidden;
            background-color: var(--yellow) !important;
            background-image: repeating-conic-gradient(from 0deg at 86% 55%, rgba(255,255,255,0) 0deg 7deg, rgba(255,255,255,0.35) 7deg 10deg) !important;
        }
        .app-container > header::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(166,5,26,0.55) 1.6px, transparent 2px);
            background-size: 8px 8px;
            -webkit-mask-image: linear-gradient(to left, #000 0%, transparent 65%);
            mask-image: linear-gradient(to left, #000 0%, transparent 65%);
            pointer-events: none;
        }
        .app-container > header::after { display: none; }
        .app-container > header > * { position: relative; z-index: 1; }


        /* ===== 像真的 App：沉浸式、不像網頁的操作手感 ===== */
        html, body { overscroll-behavior: none; }
        body { -webkit-user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
        input, textarea { -webkit-user-select: text; user-select: text; }
        main { overscroll-behavior-y: contain; -webkit-overflow-scrolling: touch; }
        main::-webkit-scrollbar { display: none; }
        a, button, img { -webkit-touch-callout: none; -webkit-user-drag: none; }

        /* 手機寬度：滿版，不要外框與陰影（只有大螢幕才保留手機外框） */
        @media (max-width: 480px) {
            /* 手機：背景用純色，沒有網點。iPhone 主畫面模式下，畫面最底部約 65pt 的範圍網頁畫不到，
               有網點時會看到一條素色帶；整個背景改純色就不會有不一致的接縫 */
            html {
                background-color: var(--paper) !important;
                background-image: none !important;
                min-height: 100%;
            }
            body { background: transparent !important; height: 100%; }
            .app-container {
                position: fixed;
                inset: 0;
                height: auto;
                max-width: none;
                background: transparent !important;
                box-shadow: none !important;
            }
        }

        /* 切換分頁的淡入動畫 */
        @keyframes tabIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
        main > section:not(.hidden) { animation: tabIn 0.18s ease-out; }
        @media (prefers-reduced-motion: reduce) { main > section:not(.hidden) { animation: none; } }



        /* 標題上方標語 */
        .slogan {
            background: var(--red);
            color: var(--yellow);
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 0.14em;
            text-align: center;
            padding: 3px 8px 2px;
            border-bottom: 3px solid var(--ink);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }


        /* 封面上的漫畫名稱：深色漸層 + 白字 + 描邊陰影，任何封面都看得清楚 */
        .cover-title {
            position: absolute;
            left: 0; right: 0; bottom: 0;
            padding: 26px 8px 6px;
            background: linear-gradient(to top, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0.62) 50%, rgba(0,0,0,0) 100%);
            pointer-events: none;
        }
        .cover-title { display: flex; align-items: flex-end; gap: 6px; }
        .cover-title > span { flex-shrink: 0; margin-bottom: 1px; }
        .cover-title h4 {
            flex: 1;
            min-width: 0;
            color: #ffffff;
            font-size: 13px;
            font-weight: 900;
            line-height: 1.25;
            letter-spacing: 0.02em;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-all;
            text-shadow: 0 1px 2px #000, 0 0 3px #000, 1px 1px 0 #000, -1px 1px 0 #000;
        }
        .app-container .cover-box { border-bottom: none; }

        /* ===== 頂部導覽：Logo + 圖示按鈕，下方文字分頁 ===== */
        .app-container > header .nav-btn {
            min-width: 44px;
            padding: 3px 6px;
            color: var(--ink);
            font-weight: 800;
            border: 2px solid transparent;
            border-radius: 12px;
            transition: transform 0.1s, background 0.15s;
        }
        .app-container > header .nav-btn:active { transform: scale(0.92); }
        .app-container > header .nav-btn.is-active {
            background: #ffffff;
            color: var(--red);
            border-color: var(--ink);
            box-shadow: 2px 2px 0 var(--ink);
        }

        /* 按鈕群組加白底，避免被背景網點干擾 */
        .nav-group {
            background: rgba(255,255,255,0.92);
            border: 2.5px solid var(--ink);
            border-radius: 16px;
            padding: 2px 4px;
            box-shadow: 3px 3px 0 var(--ink);
        }
        .app-container > header .nav-btn { min-width: 48px; border-radius: 12px; }
        .app-container > header .nav-btn i { color: var(--ink); }
        .app-container > header .nav-btn.is-active { background: var(--yellow); border-color: var(--ink); box-shadow: none; }
        .app-container > header .nav-btn.is-active i { color: var(--red); }

        #statusTabs {
            border-top: 3px solid var(--ink);
        }
        .status-tab {
            padding: 8px 0 7px;
            font-size: 14px;
            font-weight: 800;
            color: #6b6b6b;
            background: #fff;
            position: relative;
        }
        .status-tab + .status-tab { border-left: 2px solid rgba(17,17,17,0.12); }
        .status-tab.is-active {
            color: var(--red);
            font-weight: 900;
            box-shadow: inset 0 -5px 0 var(--red);
        }
        .status-tab:active { background: #fff3b0; }


        /* 自訂下拉按鈕與選項面板、確認視窗 */
        .cselect-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            border: 2px solid var(--ink);
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 12px;
            font-weight: 700;
            color: var(--ink);
            min-height: 40px;
            text-align: left;
        }
        .cselect-btn i { color: var(--red); font-size: 11px; }
        .cselect-btn:active { box-shadow: 3px 3px 0 var(--red); }
        #optionSheet > div, #confirmModal > div {
            border: 3px solid var(--ink) !important;
            box-shadow: 4px 4px 0 var(--ink) !important;
        }
        #optionSheet > div { border-bottom: none !important; border-radius: 20px 20px 0 0 !important; box-shadow: 0 -4px 0 var(--ink) !important; }
        .option-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            border: 2px solid var(--ink);
            border-radius: 12px;
            padding: 11px 12px;
            font-size: 13px;
            font-weight: 800;
            color: var(--ink);
            box-shadow: 3px 3px 0 var(--ink);
        }
        .option-item i { visibility: hidden; color: var(--red); }
        .option-item.is-selected { background: var(--yellow); }
        .option-item.is-selected i { visibility: visible; }
        .option-item:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
        #optionSheet:not(.hidden) > div { animation: sheetUp 0.18s ease-out; }
        @keyframes sheetUp { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }

        /* 彈窗背景去掉模糊，改成網點 */
        #comicModal, #editModal, #msgModal, #confirmModal, #optionSheet { backdrop-filter: none !important; background: rgba(17,17,17,0.55) !important; }
    </style>
</head>
<body class="bg-[#f5f5f5] flex justify-center items-center h-[100dvh]">

    <div class="app-container">

        <!-- Top Header -->
        <header style="border-top: env(safe-area-inset-top) solid #111;" class="w-full pb-0 bg-[#ffffff] flex flex-col flex-shrink-0 z-50">
            <div class="slogan">★ 追更不漏看・專屬你的漫畫書櫃 ★</div>
            <div class="flex items-center justify-between px-4 pt-2 pb-2">
                <div onclick="goHome()" class="flex items-center cursor-pointer active:opacity-80 transition">
                    <h1 class="text-xl font-black tracking-wider">
                        <span class="text-[#a6051a]">MANGA</span><span class="text-neutral-900">KI</span>
                    </h1>
                </div>
                <div class="nav-group flex items-end">
                    <button onclick="switchTab('categories')" id="nav-categories" class="nav-btn flex flex-col items-center justify-center">
                        <i class="fa-solid fa-compass text-[19px]"></i>
                        <span class="text-[11px] leading-none mt-1">分類</span>
                    </button>
                    <button onclick="switchTab('add')" id="nav-add" class="nav-btn flex flex-col items-center justify-center">
                        <i class="fa-solid fa-square-plus text-[19px]"></i>
                        <span class="text-[11px] leading-none mt-1">新增</span>
                    </button>
                    <button onclick="switchTab('settings')" id="nav-settings" class="nav-btn flex flex-col items-center justify-center">
                        <i class="fa-solid fa-gear text-[19px]"></i>
                        <span class="text-[11px] leading-none mt-1">設定</span>
                    </button>
                </div>
            </div>
            <div id="statusTabs" class="grid grid-cols-3 bg-white">
                <button onclick="setStatusFilter('全部')" data-status="全部" class="status-tab">全部</button>
                <button onclick="setStatusFilter('連載中')" data-status="連載中" class="status-tab">連載中</button>
                <button onclick="setStatusFilter('已完結')" data-status="已完結" class="status-tab">已完結</button>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="flex-1 w-full p-3.5 overflow-y-auto" style="padding-bottom: calc(1.5rem + env(safe-area-inset-bottom));">

            <!-- TAB 1: 首頁 (Home) -->
            <section id="tab-home" class="space-y-3">
                <!-- Comic List -->
                <div class="space-y-2.5">
                    <div class="flex justify-between items-center px-1">
                        <h3 class="font-bold text-xs text-neutral-600 flex items-center space-x-1.5 uppercase tracking-wide">
                            <i class="fa-solid fa-bookmark text-[#a6051a] text-xs"></i>
                            <span>漫畫清單</span>
                        </h3>
                        <span id="comicCount" class="text-[11px] text-neutral-600 font-medium">共 0 部</span>
                    </div>
                    <p class="text-[10px] text-neutral-500 px-1 -mt-1">點擊前往閱讀・長按編輯</p>
                    
                    <!-- Active Filter Banner -->
                    <div id="filterBannerContainer"></div>

                    <div id="comicListContainer" class="grid grid-cols-2 gap-3 items-start">
                        <!-- Dynamic Comics injected here -->
                    </div>
                    <div id="paginationContainer" class="flex items-center justify-center gap-3 pt-3 pb-2"></div>
                </div>
            </section>

            <!-- TAB 2: 分類 (Categories) -->
            <section id="tab-categories" class="hidden space-y-4">
                <div class="bg-[#ffffff] rounded-xl p-4 shadow border border-[#e5e5e5]/40">
                    <h2 class="text-base font-bold mb-1">漫畫分類瀏覽</h2>
                    <p class="text-xs text-neutral-600">點擊下方分類標籤可快速篩選對應漫畫</p>
                </div>

                <!-- Genre Grid -->
                <div class="grid grid-cols-2 gap-2.5" id="genreGrid">
                    <!-- Dynamic categories -->
                </div>
            </section>

            <!-- TAB 3: 新增 (Add) -->
            <section id="tab-add" class="hidden space-y-3.5">
                <div class="bg-[#ffffff] rounded-xl p-3.5 shadow-lg border border-[#e5e5e5]/50 flex items-center space-x-3">
                    <div class="w-9 h-9 rounded-xl bg-[#a6051a]/10 text-[#a6051a] flex items-center justify-center text-base border border-[#a6051a]/30 flex-shrink-0">
                        <i class="fa-solid fa-circle-plus"></i>
                    </div>
                    <div>
                        <h2 class="text-xs font-black tracking-wide text-neutral-900">新增漫畫</h2>
                        <p class="text-[10px] text-neutral-600">記錄漫畫名稱、分類、狀態、網址與封面</p>
                    </div>
                </div>

                <form id="addComicForm" onsubmit="handleAddNewComic(event)" class="bg-[#ffffff] rounded-xl p-3.5 shadow-lg border border-[#e5e5e5]/50 space-y-3">
                    <div>
                        <label class="block text-[11px] font-bold text-neutral-600 mb-1 flex items-center space-x-1">
                            <i class="fa-solid fa-book text-[#a6051a] text-[10px]"></i>
                            <span>漫畫名稱 *</span>
                        </label>
                        <input type="text" id="inputTitle" required placeholder="" class="w-full bg-[#fafafa] border border-[#a6051a]/40 rounded-xl px-3.5 py-2.5 text-xs text-neutral-900 placeholder-neutral-400 focus:outline-none focus:border-[#a6051a] transition shadow-inner">
                    </div>

                    <div>
                        <label class="block text-[11px] font-bold text-neutral-600 mb-1 flex items-center space-x-1">
                            <i class="fa-solid fa-tag text-[#a6051a] text-[10px]"></i>
                            <span>分類 (多個分類可用逗號分隔) *</span>
                        </label>
                        <input type="text" id="inputGenre" required placeholder="" class="w-full bg-[#fafafa] border border-[#a6051a]/40 rounded-xl px-3.5 py-2.5 text-xs text-neutral-900 placeholder-neutral-400 focus:outline-none focus:border-[#a6051a] transition shadow-inner">
                    </div>

                    <div>
                        <label class="block text-[11px] font-bold text-neutral-600 mb-1 flex items-center space-x-1">
                            <i class="fa-solid fa-circle-dot text-[#a6051a] text-[10px]"></i>
                            <span>狀態 *</span>
                        </label>
                        <div class="grid grid-cols-2 gap-2">
                            <label class="flex items-center justify-center space-x-1.5 bg-[#fafafa] border border-[#a6051a]/40 rounded-xl py-2.5 text-xs cursor-pointer hover:bg-[#e5e5e5] transition shadow-inner">
                                <input type="radio" name="inputStatus" value="連載中" checked class="accent-[#a6051a]">
                                <span class="text-neutral-900 font-bold">連載中</span>
                            </label>
                            <label class="flex items-center justify-center space-x-1.5 bg-[#fafafa] border border-[#a6051a]/40 rounded-xl py-2.5 text-xs cursor-pointer hover:bg-[#e5e5e5] transition shadow-inner">
                                <input type="radio" name="inputStatus" value="已完結" class="accent-[#a6051a]">
                                <span class="text-neutral-900 font-bold">已完結</span>
                            </label>
                        </div>
                    </div>

                    <div>
                        <label class="block text-[11px] font-bold text-neutral-600 mb-1 flex items-center space-x-1">
                            <i class="fa-solid fa-link text-[#a6051a] text-[10px]"></i>
                            <span>網址</span>
                        </label>
                        <input type="url" id="inputUrl" placeholder="" class="w-full bg-[#fafafa] border border-[#a6051a]/40 rounded-xl px-3.5 py-2.5 text-xs text-neutral-900 placeholder-neutral-400 focus:outline-none focus:border-[#a6051a] transition shadow-inner">
                    </div>

                    <div>
                        <label class="block text-[11px] font-bold text-neutral-600 mb-1 flex items-center space-x-1">
                            <i class="fa-solid fa-image text-[#a6051a] text-[10px]"></i>
                            <span>封面網址</span>
                        </label>
                        <input type="url" id="inputCoverUrl" placeholder="" class="w-full bg-[#fafafa] border border-[#a6051a]/40 rounded-xl px-3.5 py-2.5 text-xs text-neutral-900 placeholder-neutral-400 focus:outline-none focus:border-[#a6051a] transition shadow-inner">

    <script>
        // 讀取資料；內容損毀或不是陣列時，先把原始內容另存一份再回到空清單，避免整頁白屏
        function loadComics() {
            let raw = null;
            try {
                raw = localStorage.getItem('toptoon_comics');
                if (raw === null) return [];
                const parsed = JSON.parse(raw);
                if (Array.isArray(parsed)) return parsed.filter(c => c && typeof c === 'object' && typeof c.id === 'string');
                throw new Error('toptoon_comics 不是陣列');
            } catch (error) {
                console.error('TOPTOON 讀取資料失敗：', error);
                try {
                    if (raw !== null) localStorage.setItem('toptoon_comics_corrupt_backup', raw);
                } catch (e) {}
                return [];
            }
        }
        let comics = loadComics();

        let activeComicId = null;
        let activeGenreFilter = '全部';
        let activeStatusFilter = '全部';
        let currentPage = 1;
        const comicsPerPage = 10;
        function escapeHtml(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function safeUrl(url) {
            if (!url) return '';
            try {
                const parsed = new URL(url, location.href);
                return (parsed.protocol === 'http:' || parsed.protocol === 'https:') ? parsed.href : '';
            } catch (e) {
                return '';
            }
        }

        // 把輸入轉成合法的進度數字：空白、負數、亂填都變成 0（0 代表未填）
        function parseProgress(value) {
            const n = parseInt(value, 10);
            if (!Number.isFinite(n) || n < 0) return 0;
            return Math.min(n, 99999);
        }


        // 更新星期（0=週日 … 6=週六；null=未指定）
        const WEEKDAY_NAMES = ['日', '一', '二', '三', '四', '五', '六'];

        function parseUpdateDay(value) {
            if (value === null || value === undefined || value === '') return null;
            const n = Number(value);
            return Number.isInteger(n) && n >= 0 && n <= 6 ? n : null;
        }

        // 相容舊版的「更新日期」：由日期推算星期
        function getUpdateDay(comic) {
            const day = parseUpdateDay(comic.updateDay);
            if (day !== null) return day;
            if (typeof comic.updatedAt === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(comic.updatedAt)) {
                const t = new Date(comic.updatedAt + 'T00:00:00');
                if (!isNaN(t.getTime())) return t.getDay();
            }
            return null;
        }

        // 距離最近一次更新幾天（0 = 今天更新）
        function daysSinceUpdate(day) {
            return (new Date().getDay() - day + 7) % 7;
        }

        function parseGenres(genreStr) {
            if (!genreStr || genreStr.trim() === '') return ['未分類'];
            return genreStr.split(/[,，]/).map(g => g.trim()).filter(g => g.length > 0);
        }

        // 封面框依圖片比例調整（限制在 3:4 ～ 1:1 之間），圖片完整顯示、不裁切
        function fitCover(imgEl) {
            if (!imgEl.naturalWidth || !imgEl.naturalHeight || !imgEl.parentElement) return;
            const ratio = Math.min(1, Math.max(0.75, imgEl.naturalWidth / imgEl.naturalHeight));
            imgEl.parentElement.style.aspectRatio = String(ratio);
        }

        function handleImgError(imgEl) {
            // http 圖片在 https 頁面會被瀏覽器擋下，先試一次 https
            if (imgEl.src.startsWith('http://') && !imgEl.dataset.retried) {
                imgEl.dataset.retried = '1';
                imgEl.src = imgEl.src.replace('http://', 'https://');
                return;
            }
            const parent = imgEl.parentElement;
            parent.innerHTML = '<div class="w-full h-full flex items-center justify-center text-3xl">📖</div>';
        }

        function saveComics() {
            try {
                localStorage.setItem('toptoon_comics', JSON.stringify(comics));
                ghScheduleAuto();
            } catch (error) {
                console.error('TOPTOON 儲存失敗：', error);
                showMsg('儲存失敗', '無法寫入瀏覽器儲存空間，請先匯出備份。');
            }
        }

        function showMsg(title, text) {
            document.getElementById('msgTitle').innerText = title;
            document.getElementById('msgText').innerText = text;
            // 失敗／錯誤類訊息用警告圖示，其餘用打勾
            const isProblem = /失敗|錯誤|格式|不完整|不足|無法|沒有資料|沒有漫畫|尚未|驗證/.test(title);
            const icon = document.getElementById('msgIcon');
            icon.innerHTML = `<i class="fa-solid ${isProblem ? 'fa-triangle-exclamation' : 'fa-check'}"></i>`;
            document.getElementById('msgModal').classList.remove('hidden');
        }

        // 自訂確認視窗（取代系統 confirm），回傳 Promise<boolean>
        function showConfirm(title, text, options = {}) {
            return new Promise(resolve => {
                const modal = document.getElementById('confirmModal');
                const ok = document.getElementById('confirmOk');
                const cancel = document.getElementById('confirmCancel');
                document.getElementById('confirmTitle').innerText = title;
                document.getElementById('confirmText').innerText = text;
                document.getElementById('confirmIcon').innerHTML = `<i class="fa-solid ${options.danger ? 'fa-trash-can' : 'fa-question'}"></i>`;
                ok.innerText = options.okText || '確定';
                cancel.innerText = options.cancelText || '取消';
                const done = result => {
                    modal.classList.add('hidden');
                    ok.onclick = cancel.onclick = modal.onclick = null;
                    resolve(result);
                };
                ok.onclick = () => done(true);
                cancel.onclick = () => done(false);
                modal.onclick = e => { if (e.target === modal) done(false); };
                modal.classList.remove('hidden');
            });
        }

        // 自訂下拉選單（取代系統 select 彈窗）：原 <select> 隱藏但保留，值仍由它儲存
        function syncCustomSelects() {
            document.querySelectorAll('select[data-custom]').forEach(sel => {
                const label = sel.parentElement.querySelector('.cselect-label');
                if (label) label.innerText = sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].text : '';
            });
        }

        function openOptionSheet(sel, title) {
            const sheet = document.getElementById('optionSheet');
            const list = document.getElementById('optionSheetList');
            document.getElementById('optionSheetTitle').innerText = title;
            list.innerHTML = '';
            Array.from(sel.options).forEach(opt => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'option-item' + (opt.value === sel.value ? ' is-selected' : '');
                btn.innerHTML = '<span></span><i class="fa-solid fa-check"></i>';
                btn.firstChild.innerText = opt.text;
                btn.onclick = () => {
                    sel.value = opt.value;
                    sel.dispatchEvent(new Event('change', { bubbles: true }));
                    syncCustomSelects();
                    close();
                };
                list.appendChild(btn);
            });
            const close = () => { sheet.classList.add('hidden'); sheet.onclick = null; document.getElementById('optionSheetCancel').onclick = null; };
            document.getElementById('optionSheetCancel').onclick = close;
            sheet.onclick = e => { if (e.target === sheet) close(); };
            sheet.classList.remove('hidden');
        }

        function initCustomSelects() {
            document.querySelectorAll('select:not([data-custom])').forEach(sel => {
                sel.setAttribute('data-custom', '1');
                sel.style.display = 'none';
                const title = sel.parentElement.querySelector('label span')?.innerText || '請選擇';
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'cselect-btn';
                btn.innerHTML = '<span class="cselect-label"></span><i class="fa-solid fa-chevron-down"></i>';
                btn.onclick = () => openOptionSheet(sel, title);
                sel.insertAdjacentElement('afterend', btn);
            });
            syncCustomSelects();
        }

        function closeMsgModal() {
            document.getElementById('msgModal').classList.add('hidden');
        }

        // 回到內容區最上方（立即，不用平滑捲動，避免換頁時被內容高度變化打斷）
        function scrollMainTop() {
            const main = document.querySelector('.app-container > main');
            if (!main) return;
            main.scrollTop = 0;
            requestAnimationFrame(() => { main.scrollTop = 0; });
        }

        function switchTab(tabName) {
            document.querySelectorAll('.app-container > main > section').forEach(sec => sec.classList.add('hidden'));
            const targetSection = document.getElementById(`tab-${tabName}`);
            if (targetSection) {
                targetSection.classList.remove('hidden');
            }

            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.toggle('is-active', btn.id === `nav-${tabName}`);
            });
            // 狀態分頁（全部／連載中／已完結）只在首頁顯示
            document.getElementById('statusTabs').classList.toggle('hidden', tabName !== 'home');

            scrollMainTop();
            if(tabName === 'home') renderComics();
            if(tabName === 'categories') renderCategories();
            if(tabName === 'settings') { ghRenderSettings(); renderUpdateInfo(); }
        }
        function goHome() {
            currentPage = 1;
            activeGenreFilter = '全部';
            activeStatusFilter = '全部';
            switchTab('home');
        }

        function filterByGenre(genre) {
            activeGenreFilter = genre;
            currentPage = 1;
            switchTab('home');
        }

        function getFilteredComics() {
            const list = comics.filter(c =>
                (activeGenreFilter === '全部' || parseGenres(c.genre).includes(activeGenreFilter)) &&
                (activeStatusFilter === '全部' || (c.status || '連載中') === activeStatusFilter)
            );
            // 連載中排在前面，依「最近一次更新」由近到遠（今天更新的最前面）；
            // 沒指定星期的排在最後。已完結維持新增順序（排序是穩定的）
            const isOngoing = c => (c.status || '連載中') === '連載中';
            const recency = c => {
                const day = getUpdateDay(c);
                return day === null ? 99 : daysSinceUpdate(day);
            };
            return list.sort((a, b) => {
                const oa = isOngoing(a), ob = isOngoing(b);
                if (oa !== ob) return oa ? -1 : 1;
                if (!oa) return 0;
                return recency(a) - recency(b);
            });
        }

        function setStatusFilter(status) {
            activeStatusFilter = status;
            currentPage = 1;
            renderComics();
            scrollMainTop();
        }

        function renderStatusTabs() {
            document.querySelectorAll('.status-tab').forEach(btn => {
                btn.classList.toggle('is-active', btn.dataset.status === activeStatusFilter);
            });
        }

        function clearGenreFilter() {
            activeGenreFilter = '全部';
            currentPage = 1;
            renderComics();
        }

        function renderComics() {
            const container = document.getElementById('comicListContainer');
            const filterBannerContainer = document.getElementById('filterBannerContainer');

            if (activeGenreFilter !== '全部') {
                filterBannerContainer.innerHTML = `
                    <div class="bg-[#fafafa] border border-[#a6051a]/40 rounded-xl px-3 py-2 flex items-center justify-between text-xs shadow-inner mb-2.5">
                        <span class="text-neutral-600">分類篩選：<strong class="text-neutral-900">${escapeHtml(activeGenreFilter)}</strong></span>
                        <button onclick="clearGenreFilter()" class="text-[#a6051a] hover:text-[#8a0416] p-1" aria-label="清除篩選">
                            <i class="fa-solid fa-xmark text-sm"></i>
                        </button>
                    </div>
                `;
            } else {
                filterBannerContainer.innerHTML = '';
            }

            renderStatusTabs();
            const filteredComics = getFilteredComics();

            document.getElementById('comicCount').innerText = `共 ${filteredComics.length} 部`;

            if (filteredComics.length === 0) {
                container.innerHTML = `
                    <div class="bg-[#ffffff] rounded-xl p-6 text-center border border-[#a6051a]/40 text-neutral-600 space-y-2 col-span-2">
                        <i class="fa-solid fa-box-open text-2xl"></i>
                        <p class="text-xs">目前沒有符合的漫畫紀錄</p>
                    </div>
                `;
                renderPagination(0);
                return;
            }

            // 每頁只顯示 10 部漫畫
            const totalPages = Math.ceil(filteredComics.length / comicsPerPage);

            // 刪除資料後，如果目前頁數超出範圍，自動回到最後一頁
            if (currentPage > totalPages) {
                currentPage = totalPages;
            }

            const startIndex = (currentPage - 1) * comicsPerPage;
            const paginatedComics = filteredComics.slice(startIndex, startIndex + comicsPerPage);

            container.className = "grid grid-cols-2 gap-3 items-start";

            container.innerHTML = paginatedComics.map(comic => {
                const coverSrc = safeUrl(comic.coverUrl);
                const coverDisplay = coverSrc ?
                    `<div class="w-full cover-box bg-[#fafafa] rounded-xl overflow-hidden relative ">
                        <img src="${escapeHtml(coverSrc)}" referrerpolicy="no-referrer" loading="lazy" onload="fitCover(this)" class="w-full h-full object-contain group-hover:scale-105 transition duration-300" onerror="handleImgError(this)">
                     </div>` :
                    `<div class="w-full cover-box bg-[#fafafa] rounded-xl flex items-center justify-center text-3xl relative">
                        📖
                     </div>`;

                return `
                    <div data-id="${escapeHtml(comic.id)}" class="group bg-[#ffffff] hover:bg-[#f0f0f0]  rounded-xl shadow transition cursor-pointer overflow-hidden flex flex-col active:scale-[0.98]">
                        <div class="relative">
                            ${coverDisplay}
                            <div class="cover-title"><h4>${escapeHtml(comic.title)}</h4></div>
                        </div>
                    </div>
                `;
            }).join('');

            renderPagination(totalPages);
        }

        // 先提供簡單的「上一頁／下一頁」分頁
        function renderPagination(totalPages) {
            const container = document.getElementById('paginationContainer');
            if (!container) return;

            if (totalPages <= 1) {
                container.innerHTML = '';
                return;
            }

            container.innerHTML = `
                <button
                    onclick="changePage(${currentPage - 1})"
                    ${currentPage === 1 ? 'disabled' : ''}
                    class="px-4 py-2 rounded-lg text-xs font-bold border border-gray-200 bg-white ${currentPage === 1 ? 'text-gray-300 cursor-not-allowed' : 'text-neutral-700 active:bg-gray-100'}">
                    上一頁
                </button>

                <span class="text-xs text-gray-500 min-w-[70px] text-center">
                    第 ${currentPage} / ${totalPages} 頁
                </span>

                <button
                    onclick="changePage(${currentPage + 1})"
                    ${currentPage === totalPages ? 'disabled' : ''}
                    class="px-4 py-2 rounded-lg text-xs font-bold border border-gray-200 bg-white ${currentPage === totalPages ? 'text-gray-300 cursor-not-allowed' : 'text-neutral-700 active:bg-gray-100'}">
                    下一頁
                </button>
            `;
        }

        function changePage(page) {
            const filteredCount = getFilteredComics().length;

            const totalPages = Math.ceil(filteredCount / comicsPerPage);

            if (page < 1 || page > totalPages) return;

            currentPage = page;
            renderComics();

            // 換頁後回到漫畫列表頂端
            scrollMainTop();
        }

        function renderCategories() {
            const genreGrid = document.getElementById('genreGrid');
            let allGenresSet = new Set();
            comics.forEach(c => {
                parseGenres(c.genre).forEach(g => allGenresSet.add(g));
            });
            const genres = ['全部', ...allGenresSet];
        
            genreGrid.innerHTML = genres.map(g => {
                const count = g === '全部' ? comics.length : comics.filter(c => parseGenres(c.genre).includes(g)).length;
                const isSelected = activeGenreFilter === g;
                const activeStyle = isSelected ? 'border-[#a6051a] bg-[#f0f0f0] ring-1 ring-[#a6051a]/40' : 'border-[#a6051a]/40 hover:border-[#a6051a]';
        
                return `
                    <div data-genre="${escapeHtml(g)}" onclick="filterByGenre(this.dataset.genre)" class="genre-card bg-[#ffffff] ${activeStyle} p-3.5 rounded-xl border flex items-center justify-between shadow cursor-pointer transition active:scale-[0.98]">
                        <span class="font-bold text-xs text-neutral-900">${escapeHtml(g)}</span>
                        <span class="text-xs bg-[#fafafa] px-2 py-0.5 rounded-full text-neutral-600 border border-[#a6051a]/40">${count} 部</span>
                    </div>
                `;
            }).join('');
        }

        function handleAddNewComic(e) {
            e.preventDefault();
            const statusInput = document.querySelector('input[name="inputStatus"]:checked');
            const newComic = {
                id: Date.now().toString(),
                title: document.getElementById('inputTitle').value.trim(),
                genre: document.getElementById('inputGenre').value.trim(),
                status: statusInput ? statusInput.value : '連載中',
                url: safeUrl(document.getElementById('inputUrl').value.trim()),
                coverUrl: safeUrl(document.getElementById('inputCoverUrl').value.trim()),
                progress: parseProgress(document.getElementById('inputProgress').value),
                updateDay: parseUpdateDay(document.getElementById('inputUpdated').value)
            };

            comics.unshift(newComic);
            saveComics();
            document.getElementById('addComicForm').reset();
            syncCustomSelects();
            showMsg('新增成功', '已成功將漫畫加入追蹤清單！');
            switchTab('home');
        }

        function openComicModal(id) {
            activeComicId = id;
            const comic = comics.find(c => c.id === id);
            if (!comic) return;
        
            const modalEmojiContainer = document.getElementById('modalEmojiContainer');
            const coverSrc = safeUrl(comic.coverUrl);
            modalEmojiContainer.innerText = '📖';
            if (coverSrc) {
                const img = document.createElement('img');
                img.referrerPolicy = 'no-referrer';
                img.src = coverSrc;
                img.className = 'w-full h-full object-contain';
                img.onerror = () => { modalEmojiContainer.innerText = '📖'; };
                modalEmojiContainer.innerText = '';
                modalEmojiContainer.appendChild(img);
            }
        
            document.getElementById('modalTitle').innerText = comic.title;
            document.getElementById('modalGenre').innerText = `分類：${comic.genre} | 狀態：${comic.status || '連載中'}` + (getUpdateDay(comic) !== null ? ` | 更新：每週${WEEKDAY_NAMES[getUpdateDay(comic)]}` : '');
        
            const urlBox = document.getElementById('modalUrlBox');
            const urlLink = document.getElementById('modalUrlLink');
            const linkHref = safeUrl(comic.url);
            if (linkHref) {
                urlLink.href = linkHref;
                urlLink.rel = 'noopener noreferrer';
                urlBox.classList.remove('hidden');
            } else {
                urlBox.classList.add('hidden');
            }
                document.getElementById('comicModal').classList.remove('hidden');
        }
        function closeComicModal() {
                document.getElementById('comicModal').classList.add('hidden');
        }

        function openEditModal() {
            closeComicModal();
            const comic = comics.find(c => c.id === activeComicId);
            if (!comic) return;

            document.getElementById('editInputTitle').value = comic.title;
            document.getElementById('editInputGenre').value = comic.genre;
            document.getElementById('editInputUrl').value = comic.url || '';
            document.getElementById('editInputCoverUrl').value = comic.coverUrl || '';
            document.getElementById('editInputProgress').value = comic.progress > 0 ? comic.progress : '';
            const editDay = getUpdateDay(comic);
            document.getElementById('editInputUpdated').value = editDay === null ? '' : String(editDay);
            syncCustomSelects();

            const statusRadios = document.querySelectorAll('input[name="editInputStatus"]');
            statusRadios.forEach(radio => {
                radio.checked = (radio.value === (comic.status || '連載中'));
            });

            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        function handleUpdateComic(e) {
            e.preventDefault();
            const comicIndex = comics.findIndex(c => c.id === activeComicId);
            if (comicIndex === -1) return;

            const statusInput = document.querySelector('input[name="editInputStatus"]:checked');
            comics[comicIndex].title = document.getElementById('editInputTitle').value.trim();
            comics[comicIndex].genre = document.getElementById('editInputGenre').value.trim();
            comics[comicIndex].status = statusInput ? statusInput.value : '連載中';
            comics[comicIndex].url = safeUrl(document.getElementById('editInputUrl').value.trim());
            comics[comicIndex].coverUrl = safeUrl(document.getElementById('editInputCoverUrl').value.trim());

            saveComics();
            closeEditModal();
            showMsg('修改成功', '漫畫資訊已成功更新！');
            renderComics();

        async function deleteCurrentComic() {
            const comic = comics.find(c => c.id === activeComicId);
            if (!comic) return;
        
            if (!(await showConfirm('刪除漫畫', `確定要刪除「${comic.title}」嗎？\n\n刪除後無法復原。`, { danger: true, okText: '刪除' }))) return;
        
            comics = comics.filter(c => c.id !== activeComicId);
            saveComics();
            closeComicModal();
            closeEditModal();
            showMsg('刪除成功', '已從追蹤清單移除該漫畫。');
            renderComics();
        }

// 產生備份檔案名稱
function getBackupFileName() {
    return 'toptoon_backup.json';
}


function downloadBackup(blob) {
    const downloadUrl = URL.createObjectURL(blob);
    const downloadLink = document.createElement('a');
    downloadLink.href = downloadUrl;
    downloadLink.download = getBackupFileName();
    downloadLink.style.display = 'none';
    document.body.appendChild(downloadLink);
    downloadLink.click();
    document.body.removeChild(downloadLink);
    setTimeout(() => URL.revokeObjectURL(downloadUrl), 1000);
}

// 複製備份 JSON 到剪貼簿（下載/分享都不能用時的備援）
function copyBackupText() {
    if (!Array.isArray(comics) || comics.length === 0) {
        showMsg('沒有資料', '目前沒有漫畫資料可以匯出。');
        return;
    }
    const text = JSON.stringify({
        app: 'TOPTOON 漫畫紀錄網',
        version: 1,
        exportTime: new Date().toISOString(),
        count: comics.length,
        comics: comics
    }, null, 2);

    const fail = () => showMsg('複製失敗', '瀏覽器不允許寫入剪貼簿，請改用「匯出備份」。');
    if (!navigator.clipboard || !navigator.clipboard.writeText) {
        fail();
        return;
    }
    navigator.clipboard.writeText(text)
        .then(() => showMsg('已複製', '備份內容已複製，請貼到備忘錄並存成 .json 檔。'))
        .catch(fail);
}

// 匯出資料
function exportData() {

    if (!Array.isArray(comics)) {
        showMsg(
            '匯出失敗',
            '目前漫畫資料格式異常，無法進行備份。'
        );
        return;
    }

    if (comics.length === 0) {
        showMsg(
            '沒有資料',
            '目前沒有漫畫資料可以匯出。'
        );
        return;
    }

    try {

        const backupData = {
            app: 'TOPTOON 漫畫紀錄網',
            version: 1,
            exportTime: new Date().toISOString(),
            count: comics.length,
            comics: comics
        };

        const jsonData = JSON.stringify(
            backupData,
            null,
            2
        );

        const blob = new Blob(
            [jsonData],
            {
                type: 'application/json;charset=utf-8'
            }
        );

        const count = comics.length;
        const file = new File([blob], getBackupFileName(), { type: 'application/json' });

        // iOS 主畫面 App 不支援 <a download>，優先用系統分享表單（可存到「檔案」）
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
            navigator.share({ files: [file], title: 'TOPTOON 備份' })
                .then(() => showMsg('匯出成功', `已成功備份 ${count} 部漫畫資料。`))
                .catch(err => {
                    if (err && err.name === 'AbortError') return; // 使用者取消
                    console.error('TOPTOON 分享失敗，改用下載：', err);
                    downloadBackup(blob);
                    showMsg('匯出完成', '若沒有收到檔案，請改用「複製備份文字」。');
                });
            return;
        }

        downloadBackup(blob);
        showMsg(
            '匯出完成',
            `已備份 ${count} 部漫畫資料。若沒有收到檔案，請改用「複製備份文字」。`
        );

    } catch (error) {

        console.error(
            'TOPTOON 匯出錯誤：',
            error
        );

        showMsg(
            '匯出失敗',
            '建立備份檔案時發生錯誤，請稍後再試。'
        );
    }
}


// 驗證單筆漫畫資料
function validateComic(comic) {

    if (!comic || typeof comic !== 'object') {
        return false;
    }

    if (
        typeof comic.id !== 'string' ||
        typeof comic.title !== 'string' ||
        typeof comic.genre !== 'string'
    ) {
        return false;
    }

    if (
        comic.status !== undefined &&
        typeof comic.status !== 'string'
    ) {
        return false;
    }

    if (
        comic.url !== undefined &&
        typeof comic.url !== 'string'
    ) {
        return false;
    }

    if (
        comic.coverUrl !== undefined &&
        typeof comic.coverUrl !== 'string'
    ) {
        return false;
    }

    if (
        comic.progress !== undefined &&
        typeof comic.progress !== 'number'
    ) {
        return false;
    }

    if (
        comic.updatedAt !== undefined &&
        typeof comic.updatedAt !== 'string'
    ) {
        return false;
    }

    if (
        comic.updateDay !== undefined &&
        comic.updateDay !== null &&
        typeof comic.updateDay !== 'number'
    ) {
        return false;
    }

    return true;
}


// 匯入資料
function importData(e) {

    const file = e.target.files[0];

    if (!file) {
        return;
    }

    // 檢查副檔名
    if (
        !file.name.toLowerCase().endsWith('.json')
    ) {

        showMsg(
            '格式錯誤',
            '請選擇 JSON 備份檔案。'
        );

        e.target.value = '';
        return;
    }

    const reader = new FileReader();

    reader.onload = async function(event) {

        try {

            const parsedData =
                JSON.parse(event.target.result);

            let importedComics = null;

            // 新版備份格式
            if (
                parsedData &&
                !Array.isArray(parsedData) &&
                Array.isArray(parsedData.comics)
            ) {

                importedComics =
                    parsedData.comics;

            }

            // 相容舊版直接匯出的陣列格式
            else if (
                Array.isArray(parsedData)
            ) {

                importedComics =
                    parsedData;

            }

            else {

                showMsg(
                    '格式錯誤',
                    '這不是有效的 TOPTOON 漫畫備份檔。'
                );

                e.target.value = '';
                return;
            }


            // 檢查每一筆漫畫
            const invalidIndex =
                importedComics.findIndex(
                    comic => !validateComic(comic)
                );

            if (invalidIndex !== -1) {

                showMsg(
                    '資料錯誤',
                    `備份檔第 ${invalidIndex + 1} 筆漫畫資料格式不正確。`
                );

                e.target.value = '';
                return;
            }


            // 防止空資料意外覆蓋
            if (importedComics.length === 0) {

                showMsg(
                    '沒有漫畫資料',
                    '這個備份檔案沒有任何漫畫紀錄。'
                );

                e.target.value = '';
                return;
            }


            // 確認匯入
            const shouldImport = await showConfirm(
                '還原備份',

        // ================================
        // GitHub 自動備份（權杖只存在本機 localStorage）
        // ================================
        const GH_KEY = 'toptoon_gh_cfg';
        const GH_STATUS_KEY = 'toptoon_gh_status';
        const GH_DELAY_MS = 8000;
        let ghTimer = null;
        let ghBusy = false;
        let ghPending = false;

        function ghLoad() {
            try { return JSON.parse(localStorage.getItem(GH_KEY)) || {}; } catch (e) { return {}; }
        }

        function ghStoreCfg(cfg) {
            try { localStorage.setItem(GH_KEY, JSON.stringify(cfg)); return true; } catch (e) { return false; }
        }

        function ghSetStatus(ok, text) {
            const status = { ok, text, time: Date.now() };
            try { localStorage.setItem(GH_STATUS_KEY, JSON.stringify(status)); } catch (e) {}
            ghShowStatus();
        }

        function ghShowStatus() {
            const el = document.getElementById('ghStatus');
            if (!el) return;
            let status = null;
            try { status = JSON.parse(localStorage.getItem(GH_STATUS_KEY)); } catch (e) {}
            if (!status) { el.innerText = ''; return; }
            const t = new Date(status.time).toLocaleString('zh-TW', { hour12: false });
            el.innerText = `${status.ok ? '✅' : '⚠️'} ${t}　${status.text}`;
        }

        function ghCfgError(cfg) {
            if (!cfg.token) return '請輸入權杖';
            if (!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(cfg.repo || '')) return '儲存庫格式要是「擁有者/名稱」';
            if (!/^[A-Za-z0-9_.\/-]+$/.test(cfg.branch || '') || cfg.branch.includes('..')) return '分支名稱格式不正確';
            if (!/^[A-Za-z0-9_.\/-]+$/.test(cfg.path || '') || cfg.path.includes('..') || cfg.path.startsWith('/')) return '檔案路徑格式不正確';
            return '';
        }

        function ghHeaders(cfg, extra) {
            return Object.assign({
                'Authorization': `Bearer ${cfg.token}`,
                'Accept': 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28'
            }, extra || {});
        }

        function ghFileUrl(cfg) {
            return `https://api.github.com/repos/${cfg.repo}/contents/${cfg.path.split('/').map(encodeURIComponent).join('/')}`;
        }

        function ghToBase64(str) {
            const bytes = new TextEncoder().encode(str);
            let bin = '';
            bytes.forEach(b => { bin += String.fromCharCode(b); });
            return btoa(bin);
        }

        function ghFromBase64(b64) {
            const bin = atob(String(b64).replace(/\s/g, ''));
            return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
        }

        function ghErrorText(status) {
            if (status === 401) return '權杖無效或已過期';
            if (status === 403) return '權限不足或被限流（需要 Contents: Read and write）';
            if (status === 404) return '找不到儲存庫、分支，或權杖沒有這個儲存庫的權限';
            if (status === 409 || status === 422) return '分支不存在或檔案有衝突，請確認分支名稱';
            return `GitHub 回應錯誤（${status}）`;
        }

        function ghRenderSettings() {
            const cfg = ghLoad();
            const tokenEl = document.getElementById('ghToken');
            if (tokenEl) tokenEl.value = cfg.token || '';
            const auto = document.getElementById('ghAuto');
            if (auto) auto.checked = cfg.auto !== false;
            ghShowStatus();
        }

        // 只用權杖找出它授權的儲存庫；必須剛好一個，避免寫到不對的庫
        async function ghDiscoverRepo(token) {
            const res = await fetch('https://api.github.com/user/repos?per_page=100&sort=updated', {
                headers: ghHeaders({ token }),
                cache: 'no-store'
            });
            if (!res.ok) throw new Error(ghErrorText(res.status));
            // 細粒度權杖對公開庫一律唯讀，且 permissions 欄位是「使用者」的角色、不是權杖的權限；
            // 私人庫只有在權杖被明確授權時才會出現，所以只看私人庫
            const repos = (await res.json()).filter(r => r.private === true && r.permissions && r.permissions.push);
            if (repos.length === 0) throw new Error('這個權杖沒有授權任何私人儲存庫。請建立一個私人庫，並在權杖的 Repository access 選它，Contents 設為 Read and write。');
            if (repos.length > 1) {
                const names = repos.slice(0, 5).map(r => r.full_name).join('、');
                throw new Error(`這個權杖授權了 ${repos.length} 個儲存庫（${names}${repos.length > 5 ? '…' : ''}）。請重新建立只選「一個」儲存庫的權杖。`);
            }
            return repos[0];
        }

        async function ghSaveSettings() {
            const token = document.getElementById('ghToken').value.trim();
            const auto = document.getElementById('ghAuto').checked;
            if (!token) { showMsg('設定不完整', '請輸入權杖'); return; }

            let repo;
            try {
                repo = await ghDiscoverRepo(token);
            } catch (e) {
                const text = e instanceof TypeError ? '無法連到 GitHub，請確認網路後再試。' : e.message;
                showMsg('驗證失敗', text);
                return;
            }

            if (repo.private === false) {
                const go = await showConfirm('公開儲存庫', `「${repo.full_name}」是「公開」儲存庫，你的漫畫清單任何人都看得到。\n\n建議改用私人儲存庫。仍要使用嗎？`, { danger: true, okText: '仍要使用' });
                if (!go) return;
            }

            const cfg = {
                token,
                repo: repo.full_name,
                branch: repo.default_branch || 'main',
                path: 'toptoon_backup.json',
                auto
            };
            if (ghCfgError(cfg)) { showMsg('設定錯誤', ghCfgError(cfg)); return; }
            if (!ghStoreCfg(cfg)) { showMsg('儲存失敗', '無法寫入瀏覽器儲存空間。'); return; }
            ghRenderSettings();
            ghSetStatus(true, '設定已儲存');
            showMsg('設定已儲存', `將備份到 ${cfg.repo}。` + (auto ? '之後資料有變動會自動備份。' : '尚未開啟自動備份，可按「立即備份」手動備份。'));
        }

        async function ghClearSettings() {
            if (!(await showConfirm('清除設定', '確定要清除權杖與 GitHub 備份設定嗎？\n\n（不會刪除 GitHub 上已有的備份）', { danger: true, okText: '清除' }))) return;
            clearTimeout(ghTimer);
            ghTimer = null;
            try { localStorage.removeItem(GH_KEY); localStorage.removeItem(GH_STATUS_KEY); } catch (e) {}
            ghRenderSettings();
            showMsg('已清除', '權杖與設定已從這支手機移除。');
        }

        // 資料變動後排程自動備份（saveComics 會呼叫）
        function ghScheduleAuto() {
            const cfg = ghLoad();
            if (!cfg.auto || ghCfgError(cfg)) return;
            clearTimeout(ghTimer);
            ghTimer = setTimeout(() => { ghTimer = null; ghBackupNow(false); }, GH_DELAY_MS);
        }

        async function ghBackupNow(manual) {
            const cfg = ghLoad();
            const err = ghCfgError(cfg);
            if (err) { if (manual) showMsg('尚未設定', err + '，請先儲存設定。'); return; }
            if (!Array.isArray(comics) || comics.length === 0) {
                ghSetStatus(false, '目前沒有漫畫資料，已略過備份（避免覆蓋雲端備份）');
                if (manual) showMsg('沒有資料', '目前沒有漫畫資料可以備份。');
                return;
            }
            if (ghBusy) { ghPending = true; return; }
            ghBusy = true;
            clearTimeout(ghTimer);
            ghTimer = null;

            try {
                const content = JSON.stringify({
                    app: 'TOPTOON 漫畫紀錄網',
                    version: 1,
                    count: comics.length,
                    comics: comics
                }, null, 2);

                // 取得現有檔案的 sha（更新檔案需要）
                const getRes = await fetch(`${ghFileUrl(cfg)}?ref=${encodeURIComponent(cfg.branch)}`, { headers: ghHeaders(cfg), cache: 'no-store' });
                let sha;
                if (getRes.ok) {
                    const existing = await getRes.json();
                    sha = existing.sha;
                    if (existing.content && ghFromBase64(existing.content) === content) {
                        ghSetStatus(true, '內容沒有變動，不需要備份');
                        if (manual) showMsg('已是最新', 'GitHub 上的備份和目前資料一致。');
                        return;
                    }
                } else if (getRes.status !== 404) {
                    throw new Error(ghErrorText(getRes.status));
                }

                const putRes = await fetch(ghFileUrl(cfg), {
                    method: 'PUT',
                    headers: ghHeaders(cfg, { 'Content-Type': 'application/json' }),
                    body: JSON.stringify({
                        message: `TOPTOON backup (${comics.length})`,
                        content: ghToBase64(content),
                        branch: cfg.branch,
                        sha: sha
                    })
                });
                if (!putRes.ok) throw new Error(ghErrorText(putRes.status));

                ghSetStatus(true, `已備份 ${comics.length} 部漫畫`);
                if (manual) showMsg('備份成功', `已備份 ${comics.length} 部漫畫到 GitHub。`);
            } catch (error) {
                console.error('TOPTOON GitHub 備份失敗：', error);
                const text = error instanceof TypeError ? '無法連到 GitHub（可能沒有網路）' : error.message;
                ghSetStatus(false, text);
                if (manual) showMsg('備份失敗', text);
            } finally {
                ghBusy = false;
                if (ghPending) { ghPending = false; ghScheduleAuto(); }
            }
        }

        async function ghRestore() {
            const cfg = ghLoad();
            const err = ghCfgError(cfg);
            if (err) { showMsg('尚未設定', err + '，請先儲存設定。'); return; }
            try {
                const res = await fetch(`${ghFileUrl(cfg)}?ref=${encodeURIComponent(cfg.branch)}`, {
                    headers: ghHeaders(cfg, { 'Accept': 'application/vnd.github.raw+json' }),
                    cache: 'no-store'
                });
                if (!res.ok) { showMsg('還原失敗', res.status === 404 ? 'GitHub 上還沒有備份檔。' : ghErrorText(res.status)); return; }
                const text = await res.text();
                // 沿用本機還原流程（含格式驗證與確認視窗）
                const file = new File([text], 'github_backup.json', { type: 'application/json' });
                importData({ target: { files: [file], value: '' } });
            } catch (e) {
                console.error('TOPTOON GitHub 還原失敗：', e);
                showMsg('還原失敗', '無法連到 GitHub，請確認網路後再試。');
            }
        }

        // 離開畫面（切到背景）時，若有等待中的備份就立刻送出
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden' && ghTimer) {
                clearTimeout(ghTimer);
                ghTimer = null;
                ghBackupNow(false);
            }
        });

        // ================================
        // App 更新（自動 / 手動檢查 / 清除快取）
        // ================================
        const AUTO_UPDATE_KEY = 'mangaki_auto_update';
        let loadedHash = null;
        let updateReloading = false;

        function autoUpdateEnabled() {
            try { return localStorage.getItem(AUTO_UPDATE_KEY) !== '0'; } catch (e) { return true; }
        }

        function setAutoUpdate(on) {
            try { localStorage.setItem(AUTO_UPDATE_KEY, on ? '1' : '0'); } catch (e) {}
        }

        function isTyping() {
            const el = document.activeElement;
            return el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA');
        }

        // 以 index.html 的內容雜湊當作版本代碼
        async function pageHash() {
            const res = await fetch(location.pathname, { cache: 'no-store' });
            if (!res.ok) throw new Error('fetch ' + res.status);
            const text = await res.text();
            let h = 5381;
            for (let i = 0; i < text.length; i++) h = ((h << 5) + h + text.charCodeAt(i)) | 0;
            return h;
        }

        function versionLabel(h) {
            return h === null ? '讀取中…' : (h >>> 0).toString(16).padStart(8, '0');
        }

        function renderUpdateInfo() {
            const v = document.getElementById('updateVersion');
            if (v) v.innerText = `版本 ${versionLabel(loadedHash)}`;
            const t = document.getElementById('autoUpdateToggle');
            if (t) t.checked = autoUpdateEnabled();
        }

        // 自動檢查：回到 App 或每 30 分鐘；有新版就重新載入（關閉自動更新、或正在輸入時不動作）
        async function checkPageAuto() {
            try {
                if (loadedHash === null || updateReloading || isTyping() || !autoUpdateEnabled()) return;
                if ((await pageHash()) !== loadedHash) { updateReloading = true; location.reload(); }
            } catch (e) {}
        }

        async function manualCheckUpdate() {
            try {
                const latest = await pageHash();
                if (loadedHash === null) loadedHash = latest;
                if (latest === loadedHash) {
                    showMsg('已是最新版本', `目前版本代碼：${versionLabel(loadedHash)}`);
                    return;
                }
                const go = await showConfirm('有新版本', `發現新版本（${versionLabel(latest)}）。\n\n要現在更新嗎？漫畫資料不會被刪除。`, { okText: '立即更新' });
                if (go) { updateReloading = true; location.reload(); }
            } catch (e) {
                console.error('TOPTOON 檢查更新失敗：', e);
                showMsg('檢查失敗', '無法連線取得最新版本，請確認網路後再試。');
            }
        }

        // 清除快取並重新載入（漫畫資料與設定都在 localStorage，不會被清除）
        async function forceRefreshApp() {
            const go = await showConfirm('清除快取並重新載入', '會清除 App 的程式快取並重新下載最新版。\n\n漫畫資料與設定不會被刪除。', { okText: '重新載入' });
            if (!go) return;
            try {
                if ('serviceWorker' in navigator) {
                    const regs = await navigator.serviceWorker.getRegistrations();
                    await Promise.all(regs.map(r => r.unregister()));
                }
                if (window.caches) {
                    const keys = await caches.keys();
                    await Promise.all(keys.map(k => caches.delete(k)));
                }
            } catch (e) { console.error('TOPTOON 清除快取失敗：', e); }
            updateReloading = true;
            location.replace(location.pathname + '?r=' + Date.now());
        }

        pageHash().then(h => { loadedHash = h; renderUpdateInfo(); }).catch(() => {});
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') checkPageAuto();
        });
        setInterval(checkPageAuto, 30 * 60 * 1000);

        // 註冊 service worker：sw.js 本身有變動時也自動重新載入
        if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
            const hadController = !!navigator.serviceWorker.controller;

            navigator.serviceWorker.addEventListener('controllerchange', () => {
                // 第一次安裝不用重新載入；正在輸入或關閉自動更新時不動作
                if (!hadController || updateReloading || isTyping() || !autoUpdateEnabled()) return;
                updateReloading = true;
                location.reload();
            });

            navigator.serviceWorker.register('sw.js').then(reg => {
                const check = () => reg.update().catch(() => {});
                document.addEventListener('visibilitychange', () => {
                    if (document.visibilityState === 'visible') check();
                });
                setInterval(check, 30 * 60 * 1000);
            }).catch(err => console.error('TOPTOON service worker 註冊失敗：', err));
        }

        // 卡片手勢：點擊 → 前往連結；長按 → 編輯
        const LONG_PRESS_MS = 500;
        const MOVE_TOLERANCE = 10;

        function openComicLink(id) {
            const comic = comics.find(c => c.id === id);
            if (!comic) return;
            const href = safeUrl(comic.url);
            if (href) {
                window.open(href, '_blank', 'noopener,noreferrer');
            } else {
                showMsg('尚未設定網址', '這部漫畫還沒有網址。長按卡片可以編輯並加上網址。');
            }
        }

        function editComicById(id) {
            activeComicId = id;
            openEditModal();
        }

        function initCardGestures() {
            const list = document.getElementById('comicListContainer');
            let timer = null, startX = 0, startY = 0, pressedId = null, longPressed = false;

            const cancel = () => { clearTimeout(timer); timer = null; pressedId = null; };

            list.addEventListener('pointerdown', e => {
                const card = e.target.closest('[data-id]');
                if (!card) return;
                longPressed = false;
                pressedId = card.dataset.id;
                startX = e.clientX; startY = e.clientY;
                clearTimeout(timer);
                timer = setTimeout(() => {
                    timer = null;
                    longPressed = true;
                    if (navigator.vibrate) navigator.vibrate(15);
                    editComicById(pressedId);
                }, LONG_PRESS_MS);
            });
            list.addEventListener('pointermove', e => {
                if (timer && Math.hypot(e.clientX - startX, e.clientY - startY) > MOVE_TOLERANCE) cancel();
            });
            ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => list.addEventListener(t, () => { if (timer) cancel(); }));
            list.addEventListener('contextmenu', e => e.preventDefault());
            list.addEventListener('click', e => {
                const card = e.target.closest('[data-id]');
                if (!card) return;
                if (longPressed) { longPressed = false; return; }
                openComicLink(card.dataset.id);
            });
        }

        // Initialize on load
        window.onload = function() {
            initCustomSelects();
            initCardGestures();
            renderComics();
        };

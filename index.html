<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TOPTOON 漫畫紀錄網</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #074732;
            color: #ffffff;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        /* Mobile App Frame Styling */
        .app-container {
            max-width: 480px;
            width: 100%;
            height: 100dvh;
            margin: 0 auto;
            background-color: #0b5c42;
            box-shadow: 0 0 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #084732;
        }
        ::-webkit-scrollbar-thumb {
            background: #147a57;
            border-radius: 2px;
        }
    </style>
</head>
<body class="bg-[#074732] flex justify-center items-center h-[100dvh]">

    <div class="app-container">

        <!-- Top Header -->
        <header class="w-full py-3 px-4 bg-[#094c36] shadow-md flex items-center justify-between flex-shrink-0 z-50 border-b border-[#147a57]/50">
            <div class="flex items-center space-x-2">
                <h1 class="text-xl font-black tracking-wider">
                    <span class="text-red-600">TOP</span><span class="text-white">TOON</span>
                </h1>
            </div>
            <div class="flex items-center space-x-2.5">
                <button onclick="openSearchModal()" class="w-8 h-8 rounded-full bg-[#0b5c42] flex items-center justify-center hover:bg-[#147a57] active:scale-95 transition">

        <!-- Main Content Area -->
        <main class="flex-1 w-full p-3.5 pb-24 overflow-y-auto">

            <!-- TAB 1: 首頁 (Home) -->
            <section id="tab-home" class="space-y-3">
                <!-- Comic List -->
                <div class="space-y-2.5">
                    <div class="flex justify-between items-center px-1">
                        <h3 class="font-bold text-xs text-emerald-200/90 flex items-center space-x-1.5 uppercase tracking-wide">
                            <i class="fa-solid fa-bookmark text-red-500 text-xs"></i>
                            <span>我的漫畫清單</span>
                        </h3>
                        <span id="comicCount" class="text-[11px] text-emerald-200/60 font-medium">共 0 部</span>
                    </div>
                    
                    <!-- Active Filter Banner -->
                    <div id="filterBannerContainer"></div>

                    <div id="comicListContainer" class="grid grid-cols-2 gap-3">
                        <!-- Dynamic Comics injected here -->
                    </div>
                </div>
            </section>

            <!-- TAB 2: 分類 (Categories) -->
            <section id="tab-categories" class="hidden space-y-4">
                <div class="bg-[#084934] rounded-xl p-4 shadow border border-[#147a57]/40">
                    <h2 class="text-base font-bold mb-1">漫畫分類瀏覽</h2>
                    <p class="text-xs text-emerald-200/80">點擊下方分類標籤可快速篩選對應漫畫</p>
                </div>

                <!-- Genre Grid -->
                <div class="grid grid-cols-2 gap-2.5" id="genreGrid">
                    <!-- Dynamic categories -->
                </div>
            </section>

            <!-- TAB 3: 新增 (Add) -->
            <section id="tab-add" class="hidden space-y-3.5">
                <div class="bg-[#084934] rounded-xl p-3.5 shadow-lg border border-[#147a57]/50 flex items-center space-x-3">
                    <div class="w-9 h-9 rounded-xl bg-red-600/20 text-red-400 flex items-center justify-center text-base border border-red-500/30 flex-shrink-0">
                        <i class="fa-solid fa-circle-plus"></i>
                    </div>
                    <div>
                        <h2 class="text-xs font-black tracking-wide text-white">新增漫畫紀錄</h2>
                        <p class="text-[10px] text-emerald-200/70">記錄漫畫名稱、分類、狀態、網址與封面</p>
                    </div>
                </div>

                <form id="addComicForm" onsubmit="handleAddNewComic(event)" class="bg-[#084934] rounded-xl p-3.5 shadow-lg border border-[#147a57]/50 space-y-3">
                    <div>
                        <label class="block text-[11px] font-bold text-emerald-200 mb-1 flex items-center space-x-1">
                            <i class="fa-solid fa-book text-emerald-400 text-[10px]"></i>
                            <span>漫畫名稱 *</span>
                        </label>
                        <input type="text" id="inputTitle" required placeholder="例如：我獨自升級" class="w-full bg-[#0b5c42] border border-emerald-600/40 rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-emerald-400/40 focus:outline-none focus:border-emerald-400 transition shadow-inner">
                    </div>

                    <div>
                        <label class="block text-[11px] font-bold text-emerald-200 mb-1 flex items-center space-x-1">
                            <i class="fa-solid fa-tag text-emerald-400 text-[10px]"></i>
                            <span>分類 (多個分類可用逗號分隔) *</span>
                        </label>
                        <input type="text" id="inputGenre" required placeholder="例如：動作, 奇幻" class="w-full bg-[#0b5c42] border border-emerald-600/40 rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-emerald-400/40 focus:outline-none focus:border-emerald-400 transition shadow-inner">
                    </div>

                    <div>
                        <label class="block text-[11px] font-bold text-emerald-200 mb-1 flex items-center space-x-1">
                            <i class="fa-solid fa-circle-dot text-emerald-400 text-[10px]"></i>
                            <span>狀態 *</span>
                        </label>
                        <div class="grid grid-cols-2 gap-2">
                            <label class="flex items-center justify-center space-x-1.5 bg-[#0b5c42] border border-emerald-600/40 rounded-xl py-2.5 text-xs cursor-pointer hover:bg-[#147a57] transition shadow-inner">
                                <input type="radio" name="inputStatus" value="連載中" checked class="accent-emerald-500">
                                <span class="text-white font-bold">連載中</span>
                            </label>
                            <label class="flex items-center justify-center space-x-1.5 bg-[#0b5c42] border border-emerald-600/40 rounded-xl py-2.5 text-xs cursor-pointer hover:bg-[#147a57] transition shadow-inner">
                                <input type="radio" name="inputStatus" value="已完結" class="accent-emerald-500">
                                <span class="text-white font-bold">已完結</span>
                            </label>
                        </div>
                    </div>

                    <div>
                        <label class="block text-[11px] font-bold text-emerald-200 mb-1 flex items-center space-x-1">
                            <i class="fa-solid fa-link text-emerald-400 text-[10px]"></i>
                            <span>網址</span>
                        </label>
                        <input type="url" id="inputUrl" placeholder="https://..." class="w-full bg-[#0b5c42] border border-emerald-600/40 rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-emerald-400/40 focus:outline-none focus:border-emerald-400 transition shadow-inner">
                    </div>

                    <div>
                        <label class="block text-[11px] font-bold text-emerald-200 mb-1 flex items-center space-x-1">
                            <i class="fa-solid fa-image text-emerald-400 text-[10px]"></i>
                            <span>封面網址</span>
                        </label>
                        <input type="url" id="inputCoverUrl" placeholder="https://... (圖片連結)" class="w-full bg-[#0b5c42] border border-emerald-600/40 rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-emerald-400/40 focus:outline-none focus:border-emerald-400 transition shadow-inner">
                    </div>

                    <button type="submit" class="w-full bg-red-600 hover:bg-red-700 active:scale-95 text-white font-bold py-2.5 rounded-xl shadow-lg transition flex items-center justify-center space-x-2 text-xs">
                        <i class="fa-solid fa-plus text-xs"></i>
                        <span>確認新增漫畫</span>
                    </button>
                </form>
            </section>

            <!-- TAB 4: 設定 (Settings) -->
            <section id="tab-settings" class="hidden space-y-3.5">
                <div class="bg-[#084934] rounded-xl p-3.5 shadow-lg border border-[#147a57]/50 flex items-center space-x-3">
                    <div class="w-9 h-9 rounded-xl bg-emerald-600/20 text-emerald-300 flex items-center justify-center text-base border border-emerald-500/30 flex-shrink-0">
                        <i class="fa-solid fa-gear"></i>
                    </div>
                    <div>
                        <h2 class="text-xs font-black tracking-wide text-white">設定與備份</h2>
                        <p class="text-[10px] text-emerald-200/70">管理您的漫畫資料與備份</p>
                    </div>
                </div>

                <div class="bg-[#084934] rounded-xl p-3.5 shadow-lg border border-[#147a57]/50 space-y-3">
                    <div class="space-y-2">
                        <label class="block text-[11px] font-bold text-emerald-200">資料備份與還原</label>
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="exportData()" class="bg-[#0b5c42] hover:bg-[#147a57] active:scale-95 text-white font-bold py-2.5 rounded-xl transition text-xs border border-emerald-600/40 flex items-center justify-center space-x-1.5">
                                <i class="fa-solid fa-download text-xs text-emerald-300"></i>
                                <span>匯出備份 (JSON)</span>
                            </button>
                            <label class="bg-[#0b5c42] hover:bg-[#147a57] active:scale-95 text-white font-bold py-2.5 rounded-xl transition text-xs border border-emerald-600/40 flex items-center justify-center space-x-1.5 cursor-pointer">
                                <i class="fa-solid fa-upload text-xs text-emerald-300"></i>
                                <span>還原備份</span>
                                <input type="file" accept=".json" onchange="importData(event)" class="hidden">
                            </label>
                        </div>
                    </div>
                </div>
            </section>

        </main>

        <!-- Rounded Floating Bottom Navigation Bar -->
        <nav class="absolute bottom-3 left-3 right-3 bg-[#07422f] border border-white/20 z-40 max-w-[456px] mx-auto shadow-2xl rounded-2xl overflow-hidden flex-shrink-0">
            <div class="grid grid-cols-4 h-14 text-center">
                <!-- Tab 1: 首頁 -->
                <button onclick="switchTab('home')" id="nav-home" class="nav-btn flex flex-col items-center justify-center border-r border-white/20 text-white font-bold transition active:bg-[#0a523a]">
                    <i class="fa-solid fa-house text-sm mb-0.5"></i>
                    <span class="text-[10px]">首頁</span>
                </button>
                <!-- Tab 2: 分類 -->
                <button onclick="switchTab('categories')" id="nav-categories" class="nav-btn flex flex-col items-center justify-center border-r border-white/20 text-emerald-300/70 font-medium transition active:bg-[#0a523a]">
                    <i class="fa-solid fa-compass text-sm mb-0.5"></i>
                    <span class="text-[10px]">分類</span>
                </button>
                <!-- Tab 3: 新增 -->
                <button onclick="switchTab('add')" id="nav-add" class="nav-btn flex flex-col items-center justify-center border-r border-white/20 text-emerald-300/70 font-medium transition active:bg-[#0a523a]">
                    <i class="fa-solid fa-circle-plus text-sm mb-0.5"></i>
                    <span class="text-[10px]">新增</span>
                </button>
                <!-- Tab 4: 設定 -->
                <button onclick="switchTab('settings')" id="nav-settings" class="nav-btn flex flex-col items-center justify-center text-emerald-300/70 font-medium transition active:bg-[#0a523a]">
                    <i class="fa-solid fa-gear text-sm mb-0.5"></i>
                    <span class="text-[10px]">設定</span>
                </button>
            </div>
        </nav>

        <!-- Comic Detail Modal -->
        <div id="comicModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3">
            <div class="bg-[#084934] border border-[#147a57] rounded-xl w-full max-w-sm p-4 shadow-2xl relative space-y-3 max-h-[85vh] overflow-y-auto">
                <button onclick="closeComicModal()" class="absolute top-3 right-3 text-emerald-300 hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
                <div class="flex items-center space-x-3 pr-6">
                    <div id="modalEmojiContainer" class="w-12 h-12 bg-[#0b5c42] rounded-xl flex items-center justify-center text-2xl border border-emerald-600/40 shadow-inner flex-shrink-0 overflow-hidden">
                        📖
                    </div>
                    <div>
                        <h3 id="modalTitle" class="text-base font-bold">漫畫名稱</h3>
                        <p id="modalGenre" class="text-[11px] text-emerald-200/80">分類</p>
                    </div>
                </div>

                <div id="modalUrlBox" class="hidden">
                    <a id="modalUrlLink" href="#" target="_blank" class="w-full bg-red-600 hover:bg-red-700 active:scale-95 text-white py-2.5 rounded-lg font-bold transition text-xs flex items-center justify-center space-x-2 shadow">
                        <i class="fa-solid fa-external-link-alt text-xs"></i>
                        <span>前往漫畫網站閱讀</span>
                    </a>
                </div>

                <div class="grid grid-cols-2 gap-2 pt-2">
                    <button onclick="openEditModal()" class="bg-emerald-700 hover:bg-emerald-600 active:scale-95 text-white py-2.5 rounded-lg font-bold transition text-xs flex items-center justify-center space-x-1 border border-emerald-600/40">
                        <i class="fa-solid fa-pen text-xs"></i>
                        <span>修改</span>
                    </button>
                    <button onclick="deleteCurrentComic()" class="bg-red-900/60 hover:bg-red-800 active:scale-95 text-red-200 py-2.5 rounded-lg font-bold transition text-xs flex items-center justify-center space-x-1 border border-red-700/40">
                        <i class="fa-solid fa-trash-can text-xs"></i>
                        <span>刪除</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Edit Comic Modal -->
        <div id="editModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3">
            <div class="bg-[#084934] border border-[#147a57] rounded-xl w-full max-w-xs p-3.5 shadow-2xl relative space-y-2.5 max-h-[90vh] overflow-y-auto">
                <button onclick="closeEditModal()" class="absolute top-2.5 right-2.5 text-emerald-300 hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-base"></i>
                </button>
                <h3 class="text-xs font-black tracking-wide text-white mb-1.5 flex items-center space-x-1">
                    <i class="fa-solid fa-pen-to-square text-emerald-400"></i>
                    <span>修改漫畫紀錄</span>
                </h3>
                <form id="editComicForm" onsubmit="handleUpdateComic(event)" class="space-y-2.5">
                    <div>
                        <label class="block text-[11px] font-bold text-emerald-200 mb-1 flex items-center space-x-1">
                            <i class="fa-solid fa-book text-emerald-400 text-[10px]"></i>
                            <span>漫畫名稱 *</span>
                        </label>
                        <input type="text" id="editInputTitle" required class="w-full bg-[#0b5c42] border border-emerald-600/40 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-400 transition shadow-inner">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-emerald-200 mb-1 flex items-center space-x-1">
                            <i class="fa-solid fa-tag text-emerald-400 text-[10px]"></i>
                            <span>分類 (多個分類可用逗號分隔) *</span>
                        </label>
                        <input type="text" id="editInputGenre" required class="w-full bg-[#0b5c42] border border-emerald-600/40 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-400 transition shadow-inner">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-emerald-200 mb-1 flex items-center space-x-1">
                            <i class="fa-solid fa-circle-dot text-emerald-400 text-[10px]"></i>
                            <span>狀態 *</span>
                        </label>
                        <div class="grid grid-cols-2 gap-2">
                            <label class="flex items-center justify-center space-x-1.5 bg-[#0b5c42] border border-emerald-600/40 rounded-xl py-2 text-xs cursor-pointer hover:bg-[#147a57] transition shadow-inner">
                                <input type="radio" name="editInputStatus" value="連載中" class="accent-emerald-500">
                                <span class="text-white font-bold">連載中</span>
                            </label>
                            <label class="flex items-center justify-center space-x-1.5 bg-[#0b5c42] border border-emerald-600/40 rounded-xl py-2 text-xs cursor-pointer hover:bg-[#147a57] transition shadow-inner">
                                <input type="radio" name="editInputStatus" value="已完結" class="accent-emerald-500">
                                <span class="text-white font-bold">已完結</span>
                            </label>
                        </div>
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-emerald-200 mb-1 flex items-center space-x-1">
                            <i class="fa-solid fa-link text-emerald-400 text-[10px]"></i>
                            <span>網址</span>
                        </label>
                        <input type="url" id="editInputUrl" class="w-full bg-[#0b5c42] border border-emerald-600/40 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-400 transition shadow-inner">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-emerald-200 mb-1 flex items-center space-x-1">
                            <i class="fa-solid fa-image text-emerald-400 text-[10px]"></i>
                            <span>封面網址</span>
                        </label>
                        <input type="url" id="editInputCoverUrl" class="w-full bg-[#0b5c42] border border-emerald-600/40 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-400 transition shadow-inner">
                    </div>
                    <div class="flex space-x-2 pt-1">
                        <button type="button" onclick="closeEditModal()" class="flex-1 bg-[#0b5c42] hover:bg-[#147a57] active:scale-95 text-white font-bold py-2 rounded-xl transition text-xs border border-emerald-600/40">取消</button>
                        <button type="submit" class="flex-1 bg-red-600 hover:bg-red-700 active:scale-95 text-white font-bold py-2 rounded-xl shadow transition text-xs">儲存修改</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Search Modal -->
        <div id="searchModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-start justify-center pt-12 p-3">
            <div class="bg-[#084934] border border-[#147a57] rounded-xl w-full max-w-sm p-4 shadow-2xl relative space-y-3">
                <div class="flex items-center space-x-2.5 bg-[#0b5c42] px-3 py-2 rounded-lg border border-emerald-600/40">
                    <i class="fa-solid fa-search text-emerald-300 text-xs"></i>
                    <input type="text" id="searchInput" oninput="handleSearchInput(event)" placeholder="輸入漫畫標題或分類搜尋..." class="w-full bg-transparent text-white placeholder-emerald-400/50 focus:outline-none text-xs">
                    <button onclick="closeSearchModal()" class="text-emerald-300 hover:text-white p-1">
                        <i class="fa-solid fa-xmark text-xs"></i>
                    </button>
                </div>
                <div id="searchResults" class="space-y-1.5 max-h-[50vh] overflow-y-auto">
                    <!-- Search results -->
                </div>
            </div>
        </div>

        <!-- Notification / Message Box Modal -->
        <div id="msgModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3">
            <div class="bg-[#084934] border border-[#147a57] rounded-xl w-full max-w-[280px] p-4 shadow-2xl text-center space-y-3">
                <div id="msgIcon" class="w-10 h-10 rounded-full bg-emerald-600/30 text-emerald-300 flex items-center justify-center mx-auto text-base">
                    <i class="fa-solid fa-check"></i>
                </div>
                <h3 id="msgTitle" class="font-bold text-sm">提示訊息</h3>
                <p id="msgText" class="text-xs text-emerald-200/80">操作成功</p>
                <button onclick="closeMsgModal()" class="w-full bg-red-600 hover:bg-red-700 active:scale-95 text-white font-bold py-2 rounded-lg transition text-xs">確定</button>
            </div>
        </div>

    </div>

    <script>
        let comics = JSON.parse(localStorage.getItem('toptoon_comics')) || [];
        let activeComicId = null;
        let activeGenreFilter = '全部';

        // Helper function to parse genres separated by commas (half-width or full-width)
        function parseGenres(genreStr) {
            if (!genreStr || genreStr.trim() === '') return ['未分類'];
            return genreStr.split(/[,，]/).map(g => g.trim()).filter(g => g.length > 0);
        }

        function handleImgError(imgEl) {
            const parent = imgEl.parentElement;
            parent.innerHTML = '<div class="w-full h-full flex items-center justify-center text-3xl">📖</div>';
        }

        function handleImgErrorSmall(imgEl) {
            const parent = imgEl.parentElement;
            parent.innerHTML = '<span>📖</span>';
        }

        function handleImgErrorModal(imgEl) {
            const parent = imgEl.parentElement;
            parent.innerText = '📖';
        }

        function saveComics() {
            localStorage.setItem('toptoon_comics', JSON.stringify(comics));
        }

        function switchTab(tabName) {
            document.querySelectorAll('.app-container > main > section').forEach(sec => sec.classList.add('hidden'));
            const targetSection = document.getElementById(`tab-${tabName}`);
            if (targetSection) {
                targetSection.classList.remove('hidden');
            }

            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-white', 'font-bold');
                btn.classList.add('text-emerald-300/70', 'font-medium');
            });
            const activeBtn = document.getElementById(`nav-${tabName}`);
            if (activeBtn) {
                activeBtn.classList.remove('text-emerald-300/70', 'font-medium');
                activeBtn.classList.add('text-white', 'font-bold');
            }

            if(tabName === 'home') renderComics();
            if(tabName === 'categories') renderCategories();
        }

        function filterByGenre(genre) {
            activeGenreFilter = genre;
            switchTab('home');
        }

        function clearGenreFilter() {
            activeGenreFilter = '全部';
            renderComics();
        }

        function renderComics() {
            const container = document.getElementById('comicListContainer');
            const filterBannerContainer = document.getElementById('filterBannerContainer');

            // Render filter banner if active filter
            if (activeGenreFilter !== '全部') {
                filterBannerContainer.innerHTML = `
                    <div class="bg-[#0b5c42] border border-emerald-600/40 rounded-xl px-3 py-2 flex items-center justify-between text-xs shadow-inner mb-2.5">
                        <span class="text-emerald-200">分類篩選：<strong class="text-white">${activeGenreFilter}</strong></span>
                        <button onclick="clearGenreFilter()" class="text-red-400 hover:text-red-300 font-bold flex items-center space-x-1">
                            <i class="fa-solid fa-xmark text-[10px]"></i>
                            <span>顯示全部</span>
                        </button>
                    </div>
                `;
            } else {
                filterBannerContainer.innerHTML = '';
            }

            const filteredComics = activeGenreFilter === '全部' ? 
                comics : 
                comics.filter(c => parseGenres(c.genre).includes(activeGenreFilter));

            document.getElementById('comicCount').innerText = `共 ${filteredComics.length} 部`;

            if (filteredComics.length === 0) {
                container.innerHTML = `
                    <div class="bg-[#084934] rounded-xl p-6 text-center border border-emerald-600/30 text-emerald-200/60 space-y-2 col-span-2">
                        <i class="fa-solid fa-box-open text-2xl"></i>
                        <p class="text-xs">目前沒有符合的漫畫紀錄</p>
                    </div>
                `;
                return;
            }

            container.className = "grid grid-cols-2 gap-3";

            container.innerHTML = filteredComics.map(comic => {
                const coverDisplay = comic.coverUrl ? 
                    `<div class="w-full h-40 bg-[#0b5c42] rounded-t-xl overflow-hidden relative border-b border-emerald-600/30">
                        <img src="${comic.coverUrl}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" onerror="handleImgError(this)">
                     </div>` :
                    `<div class="w-full h-40 bg-[#0b5c42] rounded-t-xl flex items-center justify-center text-3xl border-b border-emerald-600/30 relative">
                        📖
                     </div>`;

                const genres = parseGenres(comic.genre);
                const genreBadges = genres.map(g => `<span class="inline-block text-[9px] bg-[#0b5c42] text-emerald-300 px-1.5 py-0.5 rounded border border-emerald-600/30 w-fit">${g}</span>`).join('');
                const statusBadge = comic.status ? `<span class="inline-block text-[9px] ${comic.status === '連載中' ? 'bg-emerald-600/50 text-emerald-200' : 'bg-red-900/50 text-red-200'} px-1.5 py-0.5 rounded border border-emerald-600/30 w-fit">${comic.status}</span>` : '';

                return `
                    <div onclick="openComicModal('${comic.id}')" class="group bg-[#084934] hover:bg-[#0a523a] border border-emerald-600/30 hover:border-emerald-400 rounded-xl shadow transition cursor-pointer overflow-hidden flex flex-col active:scale-[0.98]">
                        ${coverDisplay}
                        <div class="p-2.5 flex flex-col justify-between flex-1 space-y-1.5">
                            <h4 class="font-bold text-white text-xs line-clamp-1">${comic.title}</h4>
                            <div class="flex items-center space-x-1 flex-wrap gap-1">
                                ${genreBadges}
                                ${statusBadge}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderCategories() {
            const genreGrid = document.getElementById('genreGrid');
            let allGenresSet = new Set();
            comics.forEach(c => {
                parseGenres(c.genre).forEach(g => allGenresSet.add(g));
            });
            const uniqueGenres = [...allGenresSet];
            const genres = ['全部', ...uniqueGenres];

            genreGrid.innerHTML = genres.map(g => {
                const count = g === '全部' ? comics.length : comics.filter(c => parseGenres(c.genre).includes(g)).length;
                const isSelected = activeGenreFilter === g;
                const activeStyle = isSelected ? 'border-emerald-400 bg-[#0a523a] ring-1 ring-emerald-400/50' : 'border-emerald-600/30 hover:border-emerald-400';
                
                return `
                    <div onclick="filterByGenre('${g}')" class="genre-card bg-[#084934] ${activeStyle} p-3.5 rounded-xl border flex items-center justify-between shadow cursor-pointer transition active:scale-[0.98]">
                        <span class="font-bold text-xs text-white">${g}</span>
                        <span class="text-xs bg-[#0b5c42] px-2 py-0.5 rounded-full text-emerald-200 border border-emerald-600/40">${count} 部</span>
                    </div>
                `;
            }).join('');
        }

        function handleAddNewComic(e) {
            e.preventDefault();
            const statusInput = document.querySelector('input[name="inputStatus"]:checked');
            const newComic = {
                id: Date.now().toString(),
                title: document.getElementById('inputTitle').value.trim(),
                genre: document.getElementById('inputGenre').value.trim(),
                status: statusInput ? statusInput.value : '連載中',
                url: document.getElementById('inputUrl').value.trim(),
                coverUrl: document.getElementById('inputCoverUrl').value.trim()
            };

            comics.unshift(newComic);
            saveComics();
            document.getElementById('addComicForm').reset();
            showMsg('新增成功', '已成功將漫畫加入追蹤清單！');
            switchTab('home');
        }

        function openComicModal(id) {
            activeComicId = id;
            const comic = comics.find(c => c.id === id);
            if (!comic) return;

            const modalEmojiContainer = document.getElementById('modalEmojiContainer');
            if (comic.coverUrl) {
                modalEmojiContainer.innerHTML = `<img src="${comic.coverUrl}" class="w-full h-full object-cover" onerror="handleImgErrorModal(this)">`;
            } else {
                modalEmojiContainer.innerText = '📖';
            }

            document.getElementById('modalTitle').innerText = comic.title;
            document.getElementById('modalGenre').innerText = `分類：${comic.genre || '未分類'} | 狀態：${comic.status || '連載中'}`;

            const urlBox = document.getElementById('modalUrlBox');
            const urlLink = document.getElementById('modalUrlLink');
            if (comic.url && comic.url.trim() !== '') {
                urlLink.href = comic.url;
                urlBox.classList.remove('hidden');
            } else {
                urlBox.classList.add('hidden');
            }

            document.getElementById('comicModal').classList.remove('hidden');
        }

        function closeComicModal() {
            document.getElementById('comicModal').classList.add('hidden');
            activeComicId = null;
            renderComics();
        }

        function openEditModal() {
            const comic = comics.find(c => c.id === activeComicId);
            if (!comic) return;
            document.getElementById('editInputTitle').value = comic.title || '';
            document.getElementById('editInputGenre').value = comic.genre || '';
            
            const statusRadios = document.querySelectorAll('input[name="editInputStatus"]');
            statusRadios.forEach(r => {
                if (r.value === (comic.status || '連載中')) {
                    r.checked = true;
                }
            });

            document.getElementById('editInputUrl').value = comic.url || '';
            document.getElementById('editInputCoverUrl').value = comic.coverUrl || '';
            document.getElementById('comicModal').classList.add('hidden');
            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        function handleUpdateComic(e) {
            e.preventDefault();
            const comic = comics.find(c => c.id === activeComicId);
            if (!comic) return;

            comic.title = document.getElementById('editInputTitle').value.trim();
            comic.genre = document.getElementById('editInputGenre').value.trim();
            const editStatusInput = document.querySelector('input[name="editInputStatus"]:checked');
            comic.status = editStatusInput ? editStatusInput.value : '連載中';
            comic.url = document.getElementById('editInputUrl').value.trim();
            comic.coverUrl = document.getElementById('editInputCoverUrl').value.trim();

            saveComics();
            closeEditModal();
            renderComics();
            renderCategories();
            showMsg('修改成功', '漫畫資訊已成功更新！');
        }

        function deleteCurrentComic() {
            comics = comics.filter(c => c.id !== activeComicId);
            saveComics();
            closeComicModal();
            renderCategories();
            showMsg('刪除成功', '已從清單中移除該漫畫。');
        }

        function openSearchModal() {
            document.getElementById('searchModal').classList.remove('hidden');
            document.getElementById('searchInput').focus();
            renderSearchResults('');
        }

        function closeSearchModal() {
            document.getElementById('searchModal').classList.add('hidden');
        }

        function handleSearchInput(e) {
            renderSearchResults(e.target.value.toLowerCase());
        }

        function renderSearchResults(keyword) {
            const container = document.getElementById('searchResults');
            const filtered = comics.filter(c => c.title.toLowerCase().includes(keyword) || (c.genre && c.genre.toLowerCase().includes(keyword)));

            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center text-emerald-200/60 py-3 text-xs">找不到相關漫畫</div>`;
                return;
            }

            container.innerHTML = filtered.map(comic => {
                const coverDisplay = comic.coverUrl ? 
                    `<img src="${comic.coverUrl}" class="w-8 h-8 object-cover rounded-lg border border-emerald-600/40 shadow-inner flex-shrink-0" onerror="handleImgErrorSmall(this)">` :
                    `<span class="text-lg">📖</span>`;

                return `
                    <div onclick="closeSearchModal(); openComicModal('${comic.id}');" class="bg-[#0b5c42] hover:bg-[#147a57] p-2.5 rounded-lg cursor-pointer flex items-center justify-between transition active:scale-[0.98]">
                        <div class="flex items-center space-x-2.5">
                            ${coverDisplay}
                            <div>
                                <h5 class="font-bold text-xs">${comic.title}</h5>
                                <span class="inline-block text-[9px] bg-[#074732] text-emerald-300 px-1.5 py-0.5 rounded border border-emerald-600/30 mt-0.5">${comic.genre || '未分類'}</span>
                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-right text-[10px] text-emerald-300"></i>
                    </div>
                `;
            }).join('');
        }

        function openNotificationModal() {
            showMsg('系統通知', '目前沒有未讀的漫畫更新通知。');
        }

        function showMsg(title, text) {
            document.getElementById('msgTitle').innerText = title;
            document.getElementById('msgText').innerText = text;
            document.getElementById('msgModal').classList.remove('hidden');
        }

        function closeMsgModal() {
            document.getElementById('msgModal').classList.add('hidden');
        }

        function exportData() {
            const dataStr = JSON.stringify(comics, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const downloadAnchor = document.createElement('a');
            downloadAnchor.href = url;
            downloadAnchor.download = "toptoon_backup.json";
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            document.body.removeChild(downloadAnchor);
            URL.revokeObjectURL(url);
            showMsg('匯出成功', '漫畫紀錄備份檔案已成功下載！');
        }

        function importData(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const parsed = JSON.parse(event.target.result);
                    if (Array.isArray(parsed)) {
                        comics = parsed;
                        saveComics();
                        renderComics();
                        renderCategories();
                        showMsg('還原成功', '已成功載入備份資料！');
                    } else {
                        showMsg('格式錯誤', '檔案格式不符，無法還原。');
                    }
                } catch(err) {
                    showMsg('解析失敗', 'JSON 檔案解析發生錯誤。');
                }
            };
            reader.readAsText(file);
        }

        window.onload = function() {
            renderComics();
        }
    </script>
</body>
</html>

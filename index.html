<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <link rel="icon" type="image/png" href="Blue White Cute Simple Doodle iOS Icon - 13.PNG">
    <link rel="apple-touch-icon" href="Blue White Cute Simple Doodle iOS Icon - 13.PNG">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="TOPTOON">
    <meta name="theme-color" content="#d1fae5">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TOPTOON 漫畫紀錄網</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #ecfdf5;
            color: #022c22;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        /* Mobile App Frame Styling */
        .app-container {
            max-width: 480px;
            width: 100%;
            height: 100dvh;
            margin: 0 auto;
            background-color: #f0fdf4;
            box-shadow: 0 0 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #dcfce7;
        }
        ::-webkit-scrollbar-thumb {
            background: #a7f3d0;
            border-radius: 2px;
        }
    </style>
</head>
<body class="bg-[#ecfdf5] flex justify-center items-center h-[100dvh]">

    <div class="app-container">

        <!-- Top Header -->
        <header class="w-full py-3 px-4 bg-[#d1fae5] shadow-md flex items-center justify-between flex-shrink-0 z-50 border-b border-[#a7f3d0]/50">
            <div onclick="switchTab('home')" class="flex items-center space-x-2 cursor-pointer active:opacity-80 transition">
                <h1 class="text-xl font-black tracking-wider">
                    <span class="text-red-400">TOP</span><span class="text-emerald-950">TOON</span>
                </h1>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="flex-1 w-full p-3.5 pb-24 overflow-y-auto">

            <!-- TAB 1: 首頁 (Home) -->
            <section id="tab-home" class="space-y-3">
                <!-- Comic List -->
                <div class="space-y-2.5">
                    <div class="flex justify-between items-center px-1">
                        <h3 class="font-bold text-xs text-emerald-800 flex items-center space-x-1.5 uppercase tracking-wide">
                            <i class="fa-solid fa-bookmark text-red-400 text-xs"></i>
                            <span>漫畫清單</span>
                        </h3>
                        <span id="comicCount" class="text-[11px] text-emerald-800 font-medium">共 0 部</span>
                    </div>
                    
                    <!-- Active Filter Banner -->
                    <div id="filterBannerContainer"></div>

                    <div id="comicListContainer" class="grid grid-cols-2 gap-3">
                        <!-- Dynamic Comics injected here -->
                    </div>
                </div>
            </section>

            <!-- TAB 2: 分類 (Categories) -->
            <section id="tab-categories" class="hidden space-y-4">
                <div class="bg-[#ffffff] rounded-xl p-4 shadow border border-[#a7f3d0]/40">
                    <h2 class="text-base font-bold mb-1">漫畫分類瀏覽</h2>
                    <p class="text-xs text-emerald-800">點擊下方分類標籤可快速篩選對應漫畫</p>
                </div>

                <!-- Genre Grid -->
                <div class="grid grid-cols-2 gap-2.5" id="genreGrid">
                    <!-- Dynamic categories -->
                </div>
            </section>

            <!-- TAB 3: 新增 (Add) -->
            <section id="tab-add" class="hidden space-y-3.5">
                <div class="bg-[#ffffff] rounded-xl p-3.5 shadow-lg border border-[#a7f3d0]/50 flex items-center space-x-3">
                    <div class="w-9 h-9 rounded-xl bg-red-400/20 text-red-400 flex items-center justify-center text-base border border-red-400/30 flex-shrink-0">
                        <i class="fa-solid fa-circle-plus"></i>
                    </div>
                    <div>
                        <h2 class="text-xs font-black tracking-wide text-emerald-950">新增漫畫</h2>
                        <p class="text-[10px] text-emerald-800">記錄漫畫名稱、分類、狀態、網址與封面</p>
                    </div>
                </div>

                <form id="addComicForm" onsubmit="handleAddNewComic(event)" class="bg-[#ffffff] rounded-xl p-3.5 shadow-lg border border-[#a7f3d0]/50 space-y-3">
                    <div>
                        <label class="block text-[11px] font-bold text-emerald-800 mb-1 flex items-center space-x-1">
                            <i class="fa-solid fa-book text-emerald-600 text-[10px]"></i>
                            <span>漫畫名稱 *</span>
                        </label>
                        <input type="text" id="inputTitle" required placeholder="例如：我獨自升級" class="w-full bg-[#f0fdf4] border border-emerald-300 rounded-xl px-3.5 py-2.5 text-xs text-emerald-950 placeholder-emerald-400/40 focus:outline-none focus:border-emerald-400 transition shadow-inner">
                    </div>

                    <div>
                        <label class="block text-[11px] font-bold text-emerald-800 mb-1 flex items-center space-x-1">
                            <i class="fa-solid fa-tag text-emerald-600 text-[10px]"></i>
                            <span>分類 (多個分類可用逗號分隔) *</span>
                        </label>
                        <input type="text" id="inputGenre" required placeholder="例如：動作, 奇幻" class="w-full bg-[#f0fdf4] border border-emerald-300 rounded-xl px-3.5 py-2.5 text-xs text-emerald-950 placeholder-emerald-400/40 focus:outline-none focus:border-emerald-400 transition shadow-inner">
                    </div>

                    <div>
                        <label class="block text-[11px] font-bold text-emerald-800 mb-1 flex items-center space-x-1">
                            <i class="fa-solid fa-circle-dot text-emerald-600 text-[10px]"></i>
                            <span>狀態 *</span>
                        </label>
                        <div class="grid grid-cols-2 gap-2">
                            <label class="flex items-center justify-center space-x-1.5 bg-[#f0fdf4] border border-emerald-300 rounded-xl py-2.5 text-xs cursor-pointer hover:bg-[#a7f3d0] transition shadow-inner">
                                <input type="radio" name="inputStatus" value="連載中" checked class="accent-emerald-500">
                                <span class="text-emerald-950 font-bold">連載中</span>
                            </label>
                            <label class="flex items-center justify-center space-x-1.5 bg-[#f0fdf4] border border-emerald-300 rounded-xl py-2.5 text-xs cursor-pointer hover:bg-[#a7f3d0] transition shadow-inner">
                                <input type="radio" name="inputStatus" value="已完結" class="accent-emerald-500">
                                <span class="text-emerald-950 font-bold">已完結</span>
                            </label>
                        </div>
                    </div>

                    <div>
                        <label class="block text-[11px] font-bold text-emerald-800 mb-1 flex items-center space-x-1">
                            <i class="fa-solid fa-link text-emerald-600 text-[10px]"></i>
                            <span>網址</span>
                        </label>
                        <input type="url" id="inputUrl" placeholder="https://..." class="w-full bg-[#f0fdf4] border border-emerald-300 rounded-xl px-3.5 py-2.5 text-xs text-emerald-950 placeholder-emerald-400/40 focus:outline-none focus:border-emerald-400 transition shadow-inner">
                    </div>

                    <div>
                        <label class="block text-[11px] font-bold text-emerald-800 mb-1 flex items-center space-x-1">
                            <i class="fa-solid fa-image text-emerald-600 text-[10px]"></i>
                            <span>封面網址</span>
                        </label>
                        <input type="url" id="inputCoverUrl" placeholder="https://... (圖片連結)" class="w-full bg-[#f0fdf4] border border-emerald-300 rounded-xl px-3.5 py-2.5 text-xs text-emerald-950 placeholder-emerald-400/40 focus:outline-none focus:border-emerald-400 transition shadow-inner">
                    </div>

                    <button type="submit" class="w-full bg-red-400 hover:bg-red-500 active:scale-95 text-white font-bold py-2.5 rounded-xl shadow-lg transition flex items-center justify-center space-x-2 text-xs">
                        <i class="fa-solid fa-plus text-xs"></i>
                        <span>確認新增漫畫</span>
                    </button>
                </form>
            </section>

            <!-- TAB 4: 設定 (Settings) -->
            <section id="tab-settings" class="hidden space-y-3.5">
                <div class="bg-[#ffffff] rounded-xl p-3.5 shadow-lg border border-[#a7f3d0]/50 flex items-center space-x-3">
                    <div class="w-9 h-9 rounded-xl bg-emerald-600/20 text-emerald-600 flex items-center justify-center text-base border border-emerald-500/30 flex-shrink-0">
                        <i class="fa-solid fa-gear"></i>
                    </div>
                    <div>
                        <h2 class="text-xs font-black tracking-wide text-emerald-950">設定與備份</h2>
                        <p class="text-[10px] text-emerald-800">管理您的漫畫資料與備份</p>
                    </div>
                </div>

                <div class="bg-[#ffffff] rounded-xl p-3.5 shadow-lg border border-[#a7f3d0]/50 space-y-3">
                    <div class="space-y-2">
                        <label class="block text-[11px] font-bold text-emerald-800">資料備份與還原</label>
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="exportData()" class="bg-[#f0fdf4] hover:bg-[#a7f3d0] active:scale-95 text-emerald-950 font-bold py-2.5 rounded-xl transition text-xs border border-emerald-300 flex items-center justify-center space-x-1.5">
                                <i class="fa-solid fa-download text-xs text-emerald-600"></i>
                                <span>匯出備份</span>
                            </button>
                            <label class="bg-[#f0fdf4] hover:bg-[#a7f3d0] active:scale-95 text-emerald-950 font-bold py-2.5 rounded-xl transition text-xs border border-emerald-300 flex items-center justify-center space-x-1.5 cursor-pointer">
                                <i class="fa-solid fa-upload text-xs text-emerald-600"></i>
                                <span>還原備份</span>
                                <input type="file" accept=".json" onchange="importData(event)" class="hidden">
                            </label>
                        </div>
                    </div>
                </div>
            </section>

        </main>

        <!-- Rounded Floating Bottom Navigation Bar -->
        <nav class="absolute bottom-3 left-3 right-3 bg-[#d1fae5] border border-emerald-200 z-40 max-w-[456px] mx-auto shadow-2xl rounded-2xl overflow-hidden flex-shrink-0">
            <div class="grid grid-cols-4 h-14 text-center">
                <!-- Tab 1: 首頁 -->
                <button onclick="switchTab('home')" id="nav-home" class="nav-btn flex flex-col items-center justify-center border-r border-emerald-200 text-emerald-950 font-bold transition active:bg-[#dcfce7]">
                    <i class="fa-solid fa-house text-sm mb-0.5"></i>
                    <span class="text-[10px]">首頁</span>
                </button>
                <!-- Tab 2: 分類 -->
                <button onclick="switchTab('categories')" id="nav-categories" class="nav-btn flex flex-col items-center justify-center border-r border-emerald-200 text-emerald-600/70 font-medium transition active:bg-[#dcfce7]">
                    <i class="fa-solid fa-compass text-sm mb-0.5"></i>
                    <span class="text-[10px]">分類</span>
                </button>
                <!-- Tab 3: 新增 -->
                <button onclick="switchTab('add')" id="nav-add" class="nav-btn flex flex-col items-center justify-center border-r border-emerald-200 text-emerald-600/70 font-medium transition active:bg-[#dcfce7]">
                    <i class="fa-solid fa-circle-plus text-sm mb-0.5"></i>
                    <span class="text-[10px]">新增</span>
                </button>
                <!-- Tab 4: 設定 -->
                <button onclick="switchTab('settings')" id="nav-settings" class="nav-btn flex flex-col items-center justify-center text-emerald-600/70 font-medium transition active:bg-[#dcfce7]">
                    <i class="fa-solid fa-gear text-sm mb-0.5"></i>
                    <span class="text-[10px]">設定</span>
                </button>
            </div>
        </nav>

        <!-- Comic Detail Modal -->
        <div id="comicModal" class="fixed inset-0 bg-emerald-950/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3">
            <div class="bg-[#ffffff] border border-[#a7f3d0] rounded-xl w-full max-w-sm p-4 shadow-2xl relative space-y-3 max-h-[85vh] overflow-y-auto">
                <button onclick="closeComicModal()" class="absolute top-3 right-3 text-emerald-600 hover:text-emerald-950 p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
                <div class="flex items-center space-x-3 pr-6">
                    <div id="modalEmojiContainer" class="w-12 h-12 bg-[#f0fdf4] rounded-xl flex items-center justify-center text-2xl border border-emerald-300 shadow-inner flex-shrink-0 overflow-hidden">
                        📖
                    </div>
                    <div>
                        <h3 id="modalTitle" class="text-base font-bold">漫畫名稱</h3>
                        <p id="modalGenre" class="text-[11px] text-emerald-800">分類</p>
                    </div>
                </div>

                <div id="modalUrlBox" class="hidden">
                    <a id="modalUrlLink" href="#" target="_blank" class="w-full bg-red-400 hover:bg-red-500 active:scale-95 text-white py-2.5 rounded-lg font-bold transition text-xs flex items-center justify-center space-x-2 shadow">
                        <i class="fa-solid fa-external-link-alt text-xs"></i>
                        <span>前往漫畫網站閱讀</span>
                    </a>
                </div>

                <div class="grid grid-cols-2 gap-2 pt-2">
                    <button onclick="openEditModal()" class="bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white py-2.5 rounded-lg font-bold transition text-xs flex items-center justify-center space-x-1 border border-emerald-300">
                        <i class="fa-solid fa-pen text-xs"></i>
                        <span>修改</span>
                    </button>
                    <button onclick="deleteCurrentComic()" class="bg-red-100 hover:bg-red-200 active:scale-95 text-red-700 py-2.5 rounded-lg font-bold transition text-xs flex items-center justify-center space-x-1 border border-red-300">
                        <i class="fa-solid fa-trash-can text-xs"></i>
                        <span>刪除</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Edit Comic Modal -->
        <div id="editModal" class="fixed inset-0 bg-emerald-950/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3">
            <div class="bg-[#ffffff] border border-[#a7f3d0] rounded-xl w-full max-w-xs p-3.5 shadow-2xl relative space-y-2.5 max-h-[90vh] overflow-y-auto">
                <button onclick="closeEditModal()" class="absolute top-2.5 right-2.5 text-emerald-600 hover:text-emerald-950 p-1">
                    <i class="fa-solid fa-xmark text-base"></i>
                </button>
                <h3 class="text-xs font-black tracking-wide text-emerald-950 mb-1.5 flex items-center space-x-1">
                    <i class="fa-solid fa-pen-to-square text-emerald-600"></i>
                    <span>修改漫畫紀錄</span>
                </h3>
                <form id="editComicForm" onsubmit="handleUpdateComic(event)" class="space-y-2.5">
                    <div>
                        <label class="block text-[11px] font-bold text-emerald-800 mb-1 flex items-center space-x-1">
                            <i class="fa-solid fa-book text-emerald-600 text-[10px]"></i>
                            <span>漫畫名稱 *</span>
                        </label>
                        <input type="text" id="editInputTitle" required class="w-full bg-[#f0fdf4] border border-emerald-300 rounded-xl px-3.5 py-2.5 text-xs text-emerald-950 focus:outline-none focus:border-emerald-400 transition shadow-inner">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-emerald-800 mb-1 flex items-center space-x-1">
                            <i class="fa-solid fa-tag text-emerald-600 text-[10px]"></i>
                            <span>分類 (多個分類可用逗號分隔) *</span>
                        </label>
                        <input type="text" id="editInputGenre" required class="w-full bg-[#f0fdf4] border border-emerald-300 rounded-xl px-3.5 py-2.5 text-xs text-emerald-950 focus:outline-none focus:border-emerald-400 transition shadow-inner">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-emerald-800 mb-1 flex items-center space-x-1">
                            <i class="fa-solid fa-circle-dot text-emerald-600 text-[10px]"></i>
                            <span>狀態 *</span>
                        </label>
                        <div class="grid grid-cols-2 gap-2">
                            <label class="flex items-center justify-center space-x-1.5 bg-[#f0fdf4] border border-emerald-300 rounded-xl py-2 text-xs cursor-pointer hover:bg-[#a7f3d0] transition shadow-inner">
                                <input type="radio" name="editInputStatus" value="連載中" class="accent-emerald-500">
                                <span class="text-emerald-950 font-bold">連載中</span>
                            </label>
                            <label class="flex items-center justify-center space-x-1.5 bg-[#f0fdf4] border border-emerald-300 rounded-xl py-2 text-xs cursor-pointer hover:bg-[#a7f3d0] transition shadow-inner">
                                <input type="radio" name="editInputStatus" value="已完結" class="accent-emerald-500">
                                <span class="text-emerald-950 font-bold">已完結</span>
                            </label>
                        </div>
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-emerald-800 mb-1 flex items-center space-x-1">
                            <i class="fa-solid fa-link text-emerald-600 text-[10px]"></i>
                            <span>網址</span>
                        </label>
                        <input type="url" id="editInputUrl" class="w-full bg-[#f0fdf4] border border-emerald-300 rounded-xl px-3.5 py-2.5 text-xs text-emerald-950 focus:outline-none focus:border-emerald-400 transition shadow-inner">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-emerald-800 mb-1 flex items-center space-x-1">
                            <i class="fa-solid fa-image text-emerald-600 text-[10px]"></i>
                            <span>封面網址</span>
                        </label>
                        <input type="url" id="editInputCoverUrl" class="w-full bg-[#f0fdf4] border border-emerald-300 rounded-xl px-3.5 py-2.5 text-xs text-emerald-950 focus:outline-none focus:border-emerald-400 transition shadow-inner">
                    </div>
                    <div class="flex space-x-2 pt-1">
                        <button type="button" onclick="closeEditModal()" class="flex-1 bg-[#f0fdf4] hover:bg-[#a7f3d0] active:scale-95 text-emerald-950 font-bold py-2 rounded-xl transition text-xs border border-emerald-300">取消</button>
                        <button type="submit" class="flex-1 bg-red-400 hover:bg-red-500 active:scale-95 text-white font-bold py-2 rounded-xl shadow transition text-xs">儲存修改</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Search Modal -->
        <div id="searchModal" class="fixed inset-0 bg-emerald-950/40 backdrop-blur-sm z-50 hidden flex items-start justify-center pt-12 p-3">
            <div class="bg-[#ffffff] border border-[#a7f3d0] rounded-xl w-full max-w-sm p-4 shadow-2xl relative space-y-3">
                <div class="flex items-center space-x-2.5 bg-[#f0fdf4] px-3 py-2 rounded-lg border border-emerald-300">
                    <i class="fa-solid fa-search text-emerald-600 text-xs"></i>
                    <input type="text" id="searchInput" oninput="handleSearchInput(event)" placeholder="輸入漫畫標題或分類搜尋..." class="w-full bg-transparent text-emerald-950 placeholder-emerald-400/50 focus:outline-none text-xs">
                    <button onclick="closeSearchModal()" class="text-emerald-600 hover:text-emerald-950 p-1">
                        <i class="fa-solid fa-xmark text-xs"></i>
                    </button>
                </div>
                <div id="searchResults" class="space-y-1.5 max-h-[50vh] overflow-y-auto">
                    <!-- Search results -->
                </div>
            </div>
        </div>

        <!-- Notification / Message Box Modal -->
        <div id="msgModal" class="fixed inset-0 bg-emerald-950/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3">
            <div class="bg-[#ffffff] border border-[#a7f3d0] rounded-xl w-full max-w-[280px] p-4 shadow-2xl text-center space-y-3">
                <div id="msgIcon" class="w-10 h-10 rounded-full bg-emerald-600/30 text-emerald-600 flex items-center justify-center mx-auto text-base">
                    <i class="fa-solid fa-check"></i>
                </div>
                <h3 id="msgTitle" class="font-bold text-sm">提示訊息</h3>
                <p id="msgText" class="text-xs text-emerald-800">操作成功</p>
                <button onclick="closeMsgModal()" class="w-full bg-red-400 hover:bg-red-500 active:scale-95 text-white font-bold py-2 rounded-lg transition text-xs">確定</button>
            </div>
        </div>

        <!-- Notification Modal (Bell) -->
        <div id="notificationModal" class="fixed inset-0 bg-emerald-950/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3">
            <div class="bg-[#ffffff] border border-[#a7f3d0] rounded-xl w-full max-w-sm p-4 shadow-2xl relative space-y-3 max-h-[85vh] overflow-y-auto">
                <div class="flex items-center justify-between pb-2 border-b border-emerald-300">
                    <h3 class="font-bold text-sm text-emerald-950 flex items-center space-x-1.5">
                        <i class="fa-solid fa-bell text-emerald-600"></i>
                        <span>最新通知與更新</span>
                    </h3>
                    <button onclick="closeNotificationModal()" class="text-emerald-600 hover:text-emerald-950 p-1">
                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>
                </div>
                <div class="space-y-2.5">
                    <div class="bg-[#f0fdf4] p-3 rounded-xl border border-emerald-300 space-y-1">
                        <div class="flex justify-between items-center text-[10px] text-emerald-600/80">
                            <span>系統通知</span>
                            <span>今天</span>
                        </div>
                        <p class="text-xs text-emerald-950 font-bold">歡迎使用 TOPTOON 漫畫紀錄網！</p>
                        <p class="text-[11px] text-emerald-700">您可以在此新增追蹤清單、管理分類與備份還原資料。</p>
                    </div>
                </div>
                <button onclick="closeNotificationModal()" class="w-full bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-bold py-2 rounded-lg transition text-xs">關閉通知</button>
            </div>
        </div>

    </div>

    <script>
        let comics = JSON.parse(localStorage.getItem('toptoon_comics')) || [
            {
                id: '1710000000001',
                title: '我獨自升級',
                genre: '動作, 奇幻',
                status: '已完結',
                url: 'https://toptoon.com/',
                coverUrl: 'https://placehold.co/300x400/a7f3d0/064e3b?text=Solo+Leveling'
            },
            {
                id: '1710000000002',
                title: '女神降臨',
                genre: '愛情, 校園',
                status: '連載中',
                url: 'https://toptoon.com/',
                coverUrl: 'https://placehold.co/300x400/a7f3d0/064e3b?text=True+Beauty'
            }
        ];
        if (!localStorage.getItem('toptoon_comics')) {
            localStorage.setItem('toptoon_comics', JSON.stringify(comics));
        }

        let activeComicId = null;
        let activeGenreFilter = '全部';

        function parseGenres(genreStr) {
            if (!genreStr || genreStr.trim() === '') return ['未分類'];
            return genreStr.split(/[,，]/).map(g => g.trim()).filter(g => g.length > 0);
        }

        function handleImgError(imgEl) {
            const parent = imgEl.parentElement;
            parent.innerHTML = '<div class="w-full h-full flex items-center justify-center text-3xl">📖</div>';
        }

        function saveComics() {
            localStorage.setItem('toptoon_comics', JSON.stringify(comics));
        }

        function showMsg(title, text) {
            document.getElementById('msgTitle').innerText = title;
            document.getElementById('msgText').innerText = text;
            document.getElementById('msgModal').classList.remove('hidden');
        }

        function closeMsgModal() {
            document.getElementById('msgModal').classList.add('hidden');
        }

        function switchTab(tabName) {
            document.querySelectorAll('.app-container > main > section').forEach(sec => sec.classList.add('hidden'));
            const targetSection = document.getElementById(`tab-${tabName}`);
            if (targetSection) {
                targetSection.classList.remove('hidden');
            }

            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-emerald-950', 'font-bold');
                btn.classList.add('text-emerald-600/70', 'font-medium');
            });
            const activeBtn = document.getElementById(`nav-${tabName}`);
            if (activeBtn) {
                activeBtn.classList.remove('text-emerald-600/70', 'font-medium');
                activeBtn.classList.add('text-emerald-950', 'font-bold');
            }

            if(tabName === 'home') renderComics();
            if(tabName === 'categories') renderCategories();
        }

        function filterByGenre(genre) {
            activeGenreFilter = genre;
            switchTab('home');
        }

        function clearGenreFilter() {
            activeGenreFilter = '全部';
            renderComics();
        }

        function renderComics() {
            const container = document.getElementById('comicListContainer');
            const filterBannerContainer = document.getElementById('filterBannerContainer');

            if (activeGenreFilter !== '全部') {
                filterBannerContainer.innerHTML = `
                    <div class="bg-[#f0fdf4] border border-emerald-300 rounded-xl px-3 py-2 flex items-center justify-between text-xs shadow-inner mb-2.5">
                        <span class="text-emerald-800">分類篩選：<strong class="text-emerald-950">${activeGenreFilter}</strong></span>
                        <button onclick="clearGenreFilter()" class="text-red-400 hover:text-red-500 font-bold flex items-center space-x-1">
                            <i class="fa-solid fa-xmark text-[10px]"></i>
                            <span>顯示全部</span>
                        </button>
                    </div>
                `;
            } else {
                filterBannerContainer.innerHTML = '';
            }

            const filteredComics = activeGenreFilter === '全部' ? 
                comics : 
                comics.filter(c => parseGenres(c.genre).includes(activeGenreFilter));

            document.getElementById('comicCount').innerText = `共 ${filteredComics.length} 部`;

            if (filteredComics.length === 0) {
                container.innerHTML = `
                    <div class="bg-[#ffffff] rounded-xl p-6 text-center border border-emerald-300 text-emerald-800 space-y-2 col-span-2">
                        <i class="fa-solid fa-box-open text-2xl"></i>
                        <p class="text-xs">目前沒有符合的漫畫紀錄</p>
                    </div>
                `;
                return;
            }

            container.className = "grid grid-cols-2 gap-3";

            container.innerHTML = filteredComics.map(comic => {
                const coverDisplay = comic.coverUrl ? 
                    `<div class="w-full h-40 bg-[#f0fdf4] rounded-t-xl overflow-hidden relative border-b border-emerald-300">
                        <img src="${comic.coverUrl}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" onerror="handleImgError(this)">
                     </div>` :
                    `<div class="w-full h-40 bg-[#f0fdf4] rounded-t-xl flex items-center justify-center text-3xl border-b border-emerald-300 relative">
                        📖
                     </div>`;

                
    
                const statusBadge = comic.status ? `<span class="inline-block text-[9px] ${comic.status === '連載中' ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-700'} px-1.5 py-0.5 rounded border border-emerald-300 w-fit">${comic.status}</span>` : '';

                return `
                    <div onclick="openComicModal('${comic.id}')" class="group bg-[#ffffff] hover:bg-[#dcfce7] border border-emerald-300 hover:border-emerald-400 rounded-xl shadow transition cursor-pointer overflow-hidden flex flex-col active:scale-[0.98]">
                        ${coverDisplay}
                        <div class="p-2.5 flex flex-col justify-between flex-1 space-y-1.5">
                            <h4 class="font-bold text-emerald-950 text-xs line-clamp-1">${comic.title}</h4>
                            <div class="flex items-center space-x-1 flex-wrap gap-1">
                            
                                ${statusBadge}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderCategories() {
            const genreGrid = document.getElementById('genreGrid');
            let allGenresSet = new Set();
            comics.forEach(c => {
                parseGenres(c.genre).forEach(g => allGenresSet.add(g));
            });
            const uniqueGenres = [...allGenresSet];
            const genres = ['全部', ...uniqueGenres];

            genreGrid.innerHTML = genres.map(g => {
                const count = g === '全部' ? comics.length : comics.filter(c => parseGenres(c.genre).includes(g)).length;
                const isSelected = activeGenreFilter === g;
                const activeStyle = isSelected ? 'border-emerald-400 bg-[#dcfce7] ring-1 ring-emerald-400/50' : 'border-emerald-300 hover:border-emerald-400';
                
                return `
                    <div onclick="filterByGenre('${g}')" class="genre-card bg-[#ffffff] ${activeStyle} p-3.5 rounded-xl border flex items-center justify-between shadow cursor-pointer transition active:scale-[0.98]">
                        <span class="font-bold text-xs text-emerald-950">${g}</span>
                        <span class="text-xs bg-[#f0fdf4] px-2 py-0.5 rounded-full text-emerald-800 border border-emerald-300">${count} 部</span>
                    </div>
                `;
            }).join('');
        }

        function handleAddNewComic(e) {
            e.preventDefault();
            const statusInput = document.querySelector('input[name="inputStatus"]:checked');
            const newComic = {
                id: Date.now().toString(),
                title: document.getElementById('inputTitle').value.trim(),
                genre: document.getElementById('inputGenre').value.trim(),
                status: statusInput ? statusInput.value : '連載中',
                url: document.getElementById('inputUrl').value.trim(),
                coverUrl: document.getElementById('inputCoverUrl').value.trim()
            };

            comics.unshift(newComic);
            saveComics();
            document.getElementById('addComicForm').reset();
            showMsg('新增成功', '已成功將漫畫加入追蹤清單！');
            switchTab('home');
        }

        function openComicModal(id) {
            activeComicId = id;
            const comic = comics.find(c => c.id === id);
            if (!comic) return;

            const modalEmojiContainer = document.getElementById('modalEmojiContainer');
            if (comic.coverUrl) {
                modalEmojiContainer.innerHTML = `<img src="${comic.coverUrl}" class="w-full h-full object-cover" onerror="this.parentElement.innerText='📖'">`;
            } else {
                modalEmojiContainer.innerText = '📖';
            }

            document.getElementById('modalTitle').innerText = comic.title;
            document.getElementById('modalGenre').innerText = `分類：${comic.genre} | 狀態：${comic.status || '連載中'}`;

            const urlBox = document.getElementById('modalUrlBox');
            const urlLink = document.getElementById('modalUrlLink');
            if (comic.url && comic.url.trim() !== '') {
                urlLink.href = comic.url;
                urlBox.classList.remove('hidden');
            } else {
                urlBox.classList.add('hidden');
            }

            document.getElementById('comicModal').classList.remove('hidden');
        }

        function closeComicModal() {
            document.getElementById('comicModal').classList.add('hidden');
        }

        function openEditModal() {
            closeComicModal();
            const comic = comics.find(c => c.id === activeComicId);
            if (!comic) return;

            document.getElementById('editInputTitle').value = comic.title;
            document.getElementById('editInputGenre').value = comic.genre;
            document.getElementById('editInputUrl').value = comic.url || '';
            document.getElementById('editInputCoverUrl').value = comic.coverUrl || '';

            const statusRadios = document.querySelectorAll('input[name="editInputStatus"]');
            statusRadios.forEach(radio => {
                radio.checked = (radio.value === (comic.status || '連載中'));
            });

            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        function handleUpdateComic(e) {
            e.preventDefault();
            const comicIndex = comics.findIndex(c => c.id === activeComicId);
            if (comicIndex === -1) return;

            const statusInput = document.querySelector('input[name="editInputStatus"]:checked');
            comics[comicIndex].title = document.getElementById('editInputTitle').value.trim();
            comics[comicIndex].genre = document.getElementById('editInputGenre').value.trim();
            comics[comicIndex].status = statusInput ? statusInput.value : '連載中';
            comics[comicIndex].url = document.getElementById('editInputUrl').value.trim();
            comics[comicIndex].coverUrl = document.getElementById('editInputCoverUrl').value.trim();

            saveComics();
            closeEditModal();
            showMsg('修改成功', '漫畫資訊已成功更新！');
            renderComics();
        }

        function deleteCurrentComic() {
            comics = comics.filter(c => c.id !== activeComicId);
            saveComics();
            closeComicModal();
            showMsg('刪除成功', '已從追蹤清單移除該漫畫。');
            renderComics();
        }

        function openSearchModal() {
            document.getElementById('searchInput').value = '';
            document.getElementById('searchResults').innerHTML = '<p class="text-xs text-emerald-800/50 text-center py-2">請輸入關鍵字搜尋</p>';
            document.getElementById('searchModal').classList.remove('hidden');
            setTimeout(() => document.getElementById('searchInput').focus(), 100);
        }

        function closeSearchModal() {
            document.getElementById('searchModal').classList.add('hidden');
        }

        function handleSearchInput(e) {
            const query = e.target.value.trim().toLowerCase();
            const resultsContainer = document.getElementById('searchResults');

            if (!query) {
                resultsContainer.innerHTML = '<p class="text-xs text-emerald-800/50 text-center py-2">請輸入關鍵字搜尋</p>';
                return;
            }

            const matched = comics.filter(c => 
                c.title.toLowerCase().includes(query) || 
                c.genre.toLowerCase().includes(query)
            );

            if (matched.length === 0) {
                resultsContainer.innerHTML = '<p class="text-xs text-emerald-800 text-center py-2">找不到符合的漫畫</p>';
                return;
            }

            resultsContainer.innerHTML = matched.map(comic => `
                <div onclick="closeSearchModal(); openComicModal('${comic.id}');" class="bg-[#f0fdf4] hover:bg-[#a7f3d0] p-2.5 rounded-lg border border-emerald-300 flex items-center justify-between cursor-pointer transition">
                    <div class="flex items-center space-x-2">
                        <span class="text-base">📖</span>
                        <div>
                            <h5 class="text-xs font-bold text-emerald-950">${comic.title}</h5>
                            <span class="text-[10px] text-emerald-800">${comic.genre}</span>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-right text-xs text-emerald-600"></i>
                </div>
            `).join('');
        }

        function openNotificationModal() {
            document.getElementById('notificationModal').classList.remove('hidden');
        }

        function closeNotificationModal() {
            document.getElementById('notificationModal').classList.add('hidden');
        }
// ================================
// 資料備份功能
// ================================

function updateBackupCount() {
    const countElement = document.getElementById('backupComicCount');

    if (countElement) {
        countElement.innerText = `${comics.length} 部`;
    }
}


// 產生備份檔案名稱
function getBackupFileName() {
    const now = new Date();

    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const day = String(now.getDate()).padStart(2, '0');

    const hour = String(now.getHours()).padStart(2, '0');
    const minute = String(now.getMinutes()).padStart(2, '0');

    return `toptoon_backup_${year}-${month}-${day}_${hour}-${minute}.json`;
}


// 匯出資料
function exportData() {

    if (!Array.isArray(comics)) {
        showMsg(
            '匯出失敗',
            '目前漫畫資料格式異常，無法進行備份。'
        );
        return;
    }

    if (comics.length === 0) {
        showMsg(
            '沒有資料',
            '目前沒有漫畫資料可以匯出。'
        );
        return;
    }

    try {

        const backupData = {
            app: 'TOPTOON 漫畫紀錄網',
            version: 1,
            exportTime: new Date().toISOString(),
            count: comics.length,
            comics: comics
        };

        const jsonData = JSON.stringify(
            backupData,
            null,
            2
        );

        const blob = new Blob(
            [jsonData],
            {
                type: 'application/json;charset=utf-8'
            }
        );

        const downloadUrl =
            URL.createObjectURL(blob);

        const downloadLink =
            document.createElement('a');

        downloadLink.href = downloadUrl;
        downloadLink.download =
            getBackupFileName();

        downloadLink.style.display = 'none';

        document.body.appendChild(downloadLink);

        downloadLink.click();

        document.body.removeChild(downloadLink);

        setTimeout(() => {
            URL.revokeObjectURL(downloadUrl);
        }, 1000);

        showMsg(
            '匯出成功',
            `已成功備份 ${comics.length} 部漫畫資料。`
        );

    } catch (error) {

        console.error(
            'TOPTOON 匯出錯誤：',
            error
        );

        showMsg(
            '匯出失敗',
            '建立備份檔案時發生錯誤，請稍後再試。'
        );
    }
}


// 驗證單筆漫畫資料
function validateComic(comic) {

    if (!comic || typeof comic !== 'object') {
        return false;
    }

    if (
        typeof comic.id !== 'string' ||
        typeof comic.title !== 'string' ||
        typeof comic.genre !== 'string'
    ) {
        return false;
    }

    if (
        comic.status !== undefined &&
        typeof comic.status !== 'string'
    ) {
        return false;
    }

    if (
        comic.url !== undefined &&
        typeof comic.url !== 'string'
    ) {
        return false;
    }

    if (
        comic.coverUrl !== undefined &&
        typeof comic.coverUrl !== 'string'
    ) {
        return false;
    }

    return true;
}


// 匯入資料
function importData(e) {

    const file = e.target.files[0];

    if (!file) {
        return;
    }

    // 檢查副檔名
    if (
        !file.name.toLowerCase().endsWith('.json')
    ) {

        showMsg(
            '格式錯誤',
            '請選擇 JSON 備份檔案。'
        );

        e.target.value = '';
        return;
    }

    const reader = new FileReader();

    reader.onload = function(event) {

        try {

            const parsedData =
                JSON.parse(event.target.result);

            let importedComics = null;

            // 新版備份格式
            if (
                parsedData &&
                !Array.isArray(parsedData) &&
                Array.isArray(parsedData.comics)
            ) {

                importedComics =
                    parsedData.comics;

            }

            // 相容舊版直接匯出的陣列格式
            else if (
                Array.isArray(parsedData)
            ) {

                importedComics =
                    parsedData;

            }

            else {

                showMsg(
                    '格式錯誤',
                    '這不是有效的 TOPTOON 漫畫備份檔。'
                );

                e.target.value = '';
                return;
            }


            // 檢查每一筆漫畫
            const invalidIndex =
                importedComics.findIndex(
                    comic => !validateComic(comic)
                );

            if (invalidIndex !== -1) {

                showMsg(
                    '資料錯誤',
                    `備份檔第 ${invalidIndex + 1} 筆漫畫資料格式不正確。`
                );

                e.target.value = '';
                return;
            }


            // 防止空資料意外覆蓋
            if (importedComics.length === 0) {

                showMsg(
                    '沒有漫畫資料',
                    '這個備份檔案沒有任何漫畫紀錄。'
                );

                e.target.value = '';
                return;
            }


            // 確認匯入
            const shouldImport = confirm(
                `確定要還原 ${importedComics.length} 部漫畫嗎？\n\n` +
                `目前資料：${comics.length} 部\n` +
                `備份資料：${importedComics.length} 部\n\n` +
                `還原後會取代目前的漫畫資料。`
            );

            if (!shouldImport) {

                e.target.value = '';
                return;
            }


            // 建立新的陣列，避免直接引用 JSON
            comics =
                importedComics.map(comic => ({
                    id: String(comic.id),
                    title: String(comic.title).trim(),
                    genre: String(comic.genre).trim(),
                    status: comic.status || '連載中',
                    url: comic.url || '',
                    coverUrl: comic.coverUrl || ''
                }));


            saveComics();

            // 重置分類
            activeGenreFilter = '全部';

            // 更新畫面
            renderComics();
            renderCategories();
            updateBackupCount();

            // 清除 file input
            e.target.value = '';

            showMsg(
                '還原成功',
                `已成功還原 ${comics.length} 部漫畫紀錄。`
            );

        } catch (error) {

            console.error(
                'TOPTOON 匯入錯誤：',
                error
            );

            showMsg(
                '讀取失敗',
                '無法解析這個 JSON 備份檔案，請確認檔案沒有損壞。'
            );

            e.target.value = '';
        }
    };


    reader.onerror = function() {

        showMsg(
            '讀取失敗',
            '無法讀取備份檔案。'
        );

        e.target.value = '';
    };


    reader.readAsText(
        file,
        'UTF-8'
    );
}


// ================================
// 清除全部漫畫
// ================================

function clearAllComics() {

    if (comics.length === 0) {

        showMsg(
            '沒有資料',
            '目前沒有漫畫資料可以刪除。'
        );

        return;
    }


    const confirmed = confirm(
        `確定要清除全部 ${comics.length} 部漫畫嗎？\n\n` +
        `這個操作會刪除目前瀏覽器中的漫畫資料。\n` +
        `如果之後還需要這些資料，請先匯出備份。`
    );


    if (!confirmed) {
        return;
    }


    comics = [];

    saveComics();

    activeGenreFilter = '全部';

    renderComics();
    renderCategories();
    updateBackupCount();

    showMsg(
        '清除完成',
        '所有漫畫資料已從本機移除。'
    );
}

        // Initialize on load
        window.onload = function() {
            renderComics();
        };
    </script>
